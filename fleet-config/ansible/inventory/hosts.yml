# Fleet inventory — REGENERATE, DON'T HAND-EDIT IPs.
# Tailnet IPs rotate; `scripts/gen-inventory.sh` rewrites the ansible_host
# lines from `lumen_state.py current <node>` (the authoritative IP source).
# Node roles sourced from foreman/research/FLEET_MAP.md and
# harness/fleet-exec-policy.yaml.
all:
  vars:
    ansible_user: lumen
  children:
    gateway:
      hosts:
        lumen:
          ansible_host: 100.117.66.102
          # T5810. LiteLLM gateway (:4000), wq, foreman dispatcher, docker,
          # redis, gatus (:8418), netdata. The control node — playbooks
          # targeting lumen run with ansible_connection: local.
          ansible_connection: local
    inference:
      hosts:
        isis:
          ansible_host: 100.100.129.24
          # Ollama / GPU inference box. IP via gen-inventory.sh.
    db:
      hosts:
        sobek:
          ansible_host: 100.86.156.91
          # postgresql / cloudflared host. restart-locked for those two
          # services (fleet-exec-policy.yaml) — common role only.
    git:
      hosts:
        anubis:
          ansible_host: 100.121.17.5
          # gitea host (native install, /etc/gitea/app.ini).
    workers:
      hosts:
        maat:
          ansible_host: 100.105.219.34
          # restart-locked ("*" never-restart in fleet-exec-policy.yaml):
          # provisioning may install files but must not restart services.
        bes:
          ansible_host: 100.110.156.91
          # copy target.
    # Read-only nodes: inventory presence is documentation only. No playbook
    # may target this group — site.yml never includes it, and THOR
    # (100.112.151.100, Frank's workstation) is tier-0 hands-off.
    readonly:
      hosts:
        thor:
          ansible_host: 100.112.151.100
        ptah:
          ansible_host: 100.78.207.56
        sekhmet:
          ansible_host: 100.75.162.62
        horus:
          ansible_host: 100.83.19.124
        neith:
          ansible_host: 100.108.107.111
        khnum:
          ansible_host: 100.76.194.58
        hathor:
          ansible_host: 100.80.71.13
          # auto-sleeps by design — offline pages are not incidents.
