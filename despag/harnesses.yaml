# wq#1805: static harness catalog (UHP Harness object, harnesses.md / schema.yaml
# components.schemas.Harness). Field names are camelCase on this object — a wart the
# spec calls out to accept, not fix (PHASE0_WIRING_SPEC.md B.1 row 3 / B.1 note): the
# conformance suite checks these exact names (defaultModel, timeoutSeconds, ...).
#
# `id` is chrn_-prefixed per the schema pattern (^chrn_, checked by conformance H-01).
# `enabled: false` is a despag-local extension (Harness.additionalProperties: true) —
# a disabled harness is listed by GET /v1/harnesses but reports available: false for
# every model under it (see despag/app.py:_compute_available).
#
# wq#1810: `repo` is a despag-local extension, same standing as `enabled`
# (Harness.model_config extra="allow" in despag/uhp/models.py, so it round-trips
# through GET /v1/harnesses same as any other additionalProperties field) — it names
# the git repo despag/workspace.py checks a session's workspace out of
# (PHASE0_WIRING_SPEC.md RECOMMENDATION step 5). The conformance harnesses have no
# real product repo to point at, so they share one scratch repo that
# despag.workspace initialises once under DESPAG_DATA_DIR/scratch-repo.
harnesses:
  - id: chrn_claude-max
    name: claude-max
    base: claude-code
    baseLabel: claude-code
    defaultModel: claude-sonnet-5
    # wq#1811 (despag/tiers.py TIER_MODELS): standard tier uses only claude-sonnet-5;
    # frontier tier's claude-opus-5 / claude-fable-5-1 live on this SAME harness (D.2 —
    # tier is harness+model+effort, not a harness per tier) so both are listed here.
    models: [claude-sonnet-5, claude-opus-5, claude-fable-5-1]
    timeoutSeconds: 300
    enabled: true
    repo: scratch
  - id: chrn_litellm-mechanical
    name: litellm-mechanical
    base: claude-code
    baseLabel: claude-code
    defaultModel: deepseek-v4-flash
    # wq#1811: the mechanical tier's own model list (despag/tiers.py TIER_MODELS) — the
    # only two `routed` local-pool rungs `router.py roster` shows entitled today. No
    # cerebras rung is listed: roster does not show one as routed/entitled.
    models: [deepseek-v4-flash, qwen36-local]
    timeoutSeconds: 300
    enabled: true
    repo: scratch
  - id: chrn_claude-local-rung
    name: claude-local-rung
    base: claude-code
    baseLabel: claude-code
    defaultModel: claude-sonnet-5
    timeoutSeconds: 300
    enabled: false
    repo: scratch
