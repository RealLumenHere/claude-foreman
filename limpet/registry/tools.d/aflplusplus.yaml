# LIMPET tool manifest (schema v1). One file per tool; drop here and the
# registry rebuilds tools.json. Fields: name/path/capabilities/health_check are
# required, the rest are optional claims the agent uses to route work.
#
# wq#3972 (design/wq3929_competitive_analysis.md:171-173,417-418,493-494,
# A10/G6): AFL++ chosen over honggfuzz for the dynamic-analysis step --
# AFL/AFL++ is already the fuzzing backend TOOL_REGISTRY.md:199,210 names
# fuzzware as gluing together ("modeling + emulation + AFL/AFL++"), and its
# QEMU mode reuses the qemu-user core tool already in this registry;
# honggfuzz has no existing fleet dependency to anchor it. Live search for a
# second opinion was attempted (fleet-search web/github) and hit the known
# search-engine outage (wq#2595/wq#2599/wq#2601), so this call rests on the
# in-tree evidence above. Standard Ubuntu/Debian `aflplusplus` package; not
# yet re-verified on a dedicated Limpet node (none exists yet), same posture
# as searchsploit.yaml.
name: afl++
path: /usr/bin/afl-fuzz
version: null
description: Coverage-guided fuzzer for the dynamic-analysis step; QEMU mode pairs with qemu-user for binary-only cross-arch fuzzing.
category: dynamic-instrumentation
capabilities:
  - coverage-guided-fuzzing
  - binary-only-fuzzing
  - crash-triage
input_formats:
  - elf
  - raw-binary
output_formats:
  - crash-corpus
  - coverage-report
architectures:
  - any
hardware_requirements: {}
health_check: /usr/bin/afl-fuzz --version
