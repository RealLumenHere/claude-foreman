# Vision-based component identification pipeline (wq#3900 design, wq#3943 build):
# PCB photo -> VLM read -> marking resolution -> components.json manifest in the
# workspace. Design: design/wq3900_limpet_vision_component_id.md. Implementation:
# ops/wq3943-limpet-vision-pipeline-a1/ (capture_ops.py, vision_ops.py,
# component_lookup_ops.py, manifest_ops.py, server.py). File input works with no
# camera attached, so there is no hard hardware dependency; the health check runs
# selftest.py's pipeline-wiring probe (it can genuinely fail, unlike a bare
# binary-exists probe) -- a hand-labeled golden-board fixture is future work
# (design doc §8) pending the physical-task camera purchase (§10).

[plugin]
name = "component-id"
version = "0.1.0"
kind = "tool"
summary = "PCB photo -> VLM -> part lookup -> structured component manifest"
maintainer = "lumen-fleet"
license = "MIT"

[source]
git = "https://github.com/example/limpet-component-id"

[health]
command = "python3 /home/lumen/foreman/ops/wq3943-limpet-vision-pipeline-a1/selftest.py"
interval_seconds = 3600
timeout_seconds = 120
