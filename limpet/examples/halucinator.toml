# Catalog-sourced community LIMPET plugin (wq#3884, follow-up to wq#3850).
# Not installed on any fleet host; no [health] block -- fabricating a health
# command for a tool nobody has run here would be guessing, not verifying
# (same discipline applied by the wq#3850 stub for this same tool).
# Version/license/repo re-verified live 2026-10-14 against GitHub/PyPI --
# see research/HALUCINATOR_EVAL.md (wq#3876) for the full evaluation.

[plugin]
name = "halucinator"
version = "1.9.0"
kind = "tool"
summary = "HAL (hardware abstraction layer) emulation-based firmware rehosting framework"
maintainer = "community"
license = "GPL-3.0"

[source]
git = "https://github.com/halucinator/halucinator"
note = "Live fork (PyPI package `halucinator` v1.9.0). The original USENIX-2020 research repo, github.com/embedded-sec/halucinator, is superseded per its own README -- do not use it. Install: `git clone` + submodules, then `docker build -t halucinator ./` (per repo README, fetched 2026-10-14)."
