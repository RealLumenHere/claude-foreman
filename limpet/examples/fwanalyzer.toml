# Catalog-sourced community LIMPET plugin (wq#3884, follow-up to wq#3850).
# Not installed on any fleet host; no [health] block -- fabricating a health
# command for a tool nobody has run here would be guessing, not verifying.

[plugin]
name = "fwanalyzer"
version = "1.4.4"
kind = "tool"
summary = "Rule-based firmware filesystem image security checks (ext2/3/4, FAT/VFAT, SquashFS, UBIFS)"
maintainer = "community"
license = "Apache-2.0"

[source]
git = "https://github.com/cruise-automation/fwanalyzer"
note = "Latest tagged release v1.4.4 (confirmed via the repo's releases page, 2026-10-14; license/stars previously verified via ecosyste.ms per wq#3850). Go CLI, invoked as `fwanalyzer -cfg <rules.toml> -in <image> -out <report>`; relies on e2tools (ext) and mtools (FAT) per the repo's own README."
