# Catalog-sourced community LIMPET plugin (wq#3884, follow-up to wq#3850).
# Not installed on any fleet host; no [health] block -- fabricating a health
# command for a tool nobody has run here would be guessing, not verifying.

[plugin]
name = "ifda"
version = "0"
kind = "tool"
summary = "IoT firmware deep analysis: automated RE and vulnerability discovery for firmware binaries, with a taint-tracking/LLM-assisted core"
maintainer = "community"
license = "Apache-2.0"

[source]
git = "https://github.com/cn0xroot/IFDA"
note = "No tagged GitHub release found (checked 2026-10-14) -- version left unpinned (\"0\"). Repo's own LICENSE file and README both confirm Apache-2.0 (third-party vendored components, e.g. moria/MIT and cve-bin-tool/GPL-3.0, keep their own separate licenses per the repo's dependency table). Analysis engines wrap capstone + pyelftools/binutils; angr taint engine is an optional future drop-in per the README."
