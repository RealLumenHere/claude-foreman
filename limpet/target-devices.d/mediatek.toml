# wq#3940 — LIMPET HAL target device database: mediatek (14 entries)
# wq#4190 — reconciled against the source-verified catalog
# /home/lumen/projects/limpet/data/usb-device-ids.toml (generated 2026-10-15,
# data/_src/gen_usb_ids.py). Fixed 0e8d:2000/2001: the wq#3923 research pass
# (ISSUE-LOG #1365: recalled, not sourced) labelled both "BROM"; mtkclient's own
# usb_ids.py tags them "Preloader" (VCOM), not BROM. Fixed 0e8d:201d: previously
# labelled "Preloader VCOM"; the verified catalog (android-rules) says this is a
# normally-booted device's ADB+MTP composite, not a preloader-stage pair. Added
# the missing 0e8d:6000/20ff/3000 preloader PIDs and the OEM-VID rebrands
# (1004:6000 LG, 22d9:0006 OPPO, 0fce:f200/d1e9/d1e2/d1ec Sony). Dropped
# 0e8d:0002 and 0e8d:2005, which the verified catalog has no primary source for.
#
# Drop-in catalog for /etc/limpet/target-devices.d/. Loaded by
# limpet/target_devices.py, which is what ops/wq3809-limpet-hal/hal.py's
# target_device plugin queries for real-time enrichment and what
# limpet/target-devices.d/91-limpet-targets.rules is generated from
# (python3 limpet/target_devices.py render-udev-rules).
#
# SCHEMA (per [[device]]):
#   match_type        "vid_pid" | "vid_pid_wildcard" (pid="*") | "usb_class"
#   usb_vid, usb_pid  lowercase hex strings; "" when match_type="usb_class"
#   class_code        "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor            silicon/OEM vendor name
#   soc_family        short chip-family/platform tag
#   soc_model         specific chip model(s) this pair is known to cover (may be a
#                     superset: several vendors do not vary the boot-mode PID by
#                     model, so model identity comes from the flashing tool's own
#                     post-connect handshake, not from the PID — see notes)
#   mode_name         human name of the boot/recovery mode
#   recommended_tool  the tool to dispatch to
#   confidence        "high" | "medium" | "low" (>=0.75 high, 0.45-0.74 medium,
#                     <0.45 low on the verified catalog's 0.0-1.0 source scale).
#                     Below "high" should not gate an irreversible action without
#                     an operator confirm.
#   notes             caveats, protocol notes, disambiguation from a similar entry

[[device]]
match_type = "vid_pid"
usb_vid = "0e8d"
usb_pid = "0003"
class_code = ""
vendor = "MediaTek Inc."
soc_family = "MediaTek (family-wide)"
soc_model = "MT6580, MT6735, MT6739, MT6761, MT6765, MT6768, MT6771/MT8183, MT6785, MT8167, MT8186, MT8788 and other BROM-capable chips"
mode_name = "BROM (BootROM USB mode, pre-preloader)"
recommended_tool = "mtkclient / SP Flash Tool"
confidence = "high"
notes = "usb.ids still labels this 'MT6227 phone' (legacy). Identical for every SoC listed; MediaTek does not vary the BROM PID by SoC model -- chip identity comes from the hw_code read after the BROM handshake. MT8167/MT8186/MT8788 are expected to enumerate the same way but their hw_codes are not individually verified. Sources: mtkclient usb_ids.py, mtkclient README, usb.ids."

