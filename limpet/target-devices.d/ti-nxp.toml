# wq#3940 — LIMPET HAL target device database: ti/nxp (23 entries)
# wq#4190 — the NXP (15a2/1fc9) and STM32 DFU (0483:df11) rows reconciled
# against the source-verified catalog
# /home/lumen/projects/limpet/data/usb-device-ids.toml (generated 2026-10-15,
# data/_src/gen_usb_ids.py): fixed 15a2:0061 (the wq#3923 research pass,
# ISSUE-LOG #1365, called this i.MX7 Solo/Dual; verified source says i.MX
# 6Solo/6DualLite) and 1fc9:0126 (was called i.MX7Solo/7Dual SDP at low
# confidence; verified source says i.MX 7ULP recovery, high confidence). Added
# the missing 15a2:0076/0080/004f/006a and 1fc9:012b. The remaining TI
# Stellaris/Sitara/MSP430, Atmel, Nordic, Espressif, Cypress, PIC32 and debug-
# probe rows are untouched: the verified catalog's own research pass did not
# cover those vendors (no primary source either way), so there is nothing to
# reconcile them against.
#
# Drop-in catalog for /etc/limpet/target-devices.d/. Built from the wq#3923 SoC
# boot-mode USB VID:PID research (ops/wq3809-limpet-hal/usb_boot_signatures.toml,
# research/WQ3923_USB_BOOT_MODE_SIGNATURES.md) reshaped into this ticket's
# per-vendor-family schema. Loaded by limpet/target_devices.py, which is what
# ops/wq3809-limpet-hal/hal.py's target_device plugin queries for real-time
# enrichment and what limpet/target-devices.d/91-limpet-targets.rules is generated
# from (python3 limpet/target_devices.py render-udev-rules).
#
# SCHEMA (per [[device]]):
#   match_type        "vid_pid" | "vid_pid_wildcard" (pid="*") | "usb_class"
#   usb_vid, usb_pid  lowercase hex strings; "" when match_type="usb_class"
#   class_code        "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor            silicon/OEM vendor name
#   soc_family        short chip-family/platform tag
#   soc_model         specific chip model(s) this pair is known to cover (may be a
#                     superset: several vendors do not vary the boot-mode PID by
#                     model, so model identity comes from the flashing tool's own
#                     post-connect handshake, not from the PID — see notes)
#   mode_name         human name of the boot/recovery mode
#   recommended_tool  the tool to dispatch to
#   confidence        "high" | "medium" | "low" — corroboration strength in the
#                     wq#3923 research corpus, NOT a live hardware verification.
#                     Below "high" should not gate an irreversible action without
#                     an operator confirm (same posture as usb_boot_signatures.toml).
#   notes             caveats, protocol notes, disambiguation from a similar entry

[[device]]
match_type = "vid_pid"
usb_vid = "0483"
usb_pid = "df11"
class_code = ""
vendor = "STMicroelectronics"
soc_family = "STM32 (all F0/F1/F2/F3/F4/F7/G0/G4/H7/L0/L1/L4/WB/WL families with the in-ROM USB DFU bootloader enabled)"
soc_model = "STM32 (all F0/F1/F2/F3/F4/F7/G0/G4/H7/L0/L1/L4/WB/WL families with the in-ROM USB DFU bootloader enabled)"
mode_name = "DFU (in-ROM System Memory bootloader)"
recommended_tool = "dfu-util"
confidence = "high"
notes = "The single most common and best-documented MCU DFU pair in existence — ST's in-ROM bootloader, entered via BOOT0 strap or a software jump, identical across nearly the entire STM32 line."

