# wq#3940 — LIMPET HAL target device database: amlogic (3 entries)
#
# Drop-in catalog for /etc/limpet/target-devices.d/. Built from the wq#3923 SoC
# boot-mode USB VID:PID research (ops/wq3809-limpet-hal/usb_boot_signatures.toml,
# research/WQ3923_USB_BOOT_MODE_SIGNATURES.md) reshaped into this ticket's
# per-vendor-family schema. Loaded by limpet/target_devices.py, which is what
# ops/wq3809-limpet-hal/hal.py's target_device plugin queries for real-time
# enrichment and what limpet/target-devices.d/91-limpet-targets.rules is generated
# from (python3 limpet/target_devices.py render-udev-rules).
#
# SCHEMA (per [[device]]):
#   match_type        "vid_pid" | "vid_pid_wildcard" (pid="*") | "usb_class"
#   usb_vid, usb_pid  lowercase hex strings; "" when match_type="usb_class"
#   class_code        "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor            silicon/OEM vendor name
#   soc_family        short chip-family/platform tag
#   soc_model         specific chip model(s) this pair is known to cover (may be a
#                     superset: several vendors do not vary the boot-mode PID by
#                     model, so model identity comes from the flashing tool's own
#                     post-connect handshake, not from the PID — see notes)
#   mode_name         human name of the boot/recovery mode
#   recommended_tool  the tool to dispatch to
#   confidence        "high" | "medium" | "low" — corroboration strength in the
#                     wq#3923 research corpus, NOT a live hardware verification.
#                     Below "high" should not gate an irreversible action without
#                     an operator confirm (same posture as usb_boot_signatures.toml).
#   notes             caveats, protocol notes, disambiguation from a similar entry

[[device]]
match_type = "vid_pid"
usb_vid = "1b8e"
usb_pid = "c003"
class_code = ""
vendor = "Amlogic, Inc."
soc_family = "S905"
soc_model = "S905, S905X, S905X2, S905X3, S912, A113X, A311D, S905X4, S905Y4"
mode_name = "USB burn mode (BootROM download)"
recommended_tool = "pyamlboot"
confidence = "high"
notes = "The broad, generation-spanning Amlogic pair that pyamlboot's amlboot.py checks for. Like MediaTek/Allwinner, the PID does not discriminate chip model — pyamlboot reads chip identity back over the USB protocol after connecting."

