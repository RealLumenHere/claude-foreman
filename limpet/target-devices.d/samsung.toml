# wq#3940 — LIMPET HAL target device database: samsung (5 entries)
# wq#4190 — reconciled against the source-verified catalog
# /home/lumen/projects/limpet/data/usb-device-ids.toml (generated 2026-10-15,
# data/_src/gen_usb_ids.py). Fixed 04e8:6860: the wq#3923 research pass
# (ISSUE-LOG #1365: recalled, not sourced) catalogued it as an "Odin download
# mode (composite variant)" — usb.ids and the verified catalog both say this is
# Samsung Galaxy MTP mode, not a flashing mode at all. Dropped 04e8:6764
# ("older firmware generation" Odin pair), which the verified catalog has no
# primary source for. Added 04e8:685e (ADB), present in the verified catalog
# but missing here.
#
# Drop-in catalog for /etc/limpet/target-devices.d/. Loaded by
# limpet/target_devices.py, which is what ops/wq3809-limpet-hal/hal.py's
# target_device plugin queries for real-time enrichment and what
# limpet/target-devices.d/91-limpet-targets.rules is generated from
# (python3 limpet/target_devices.py render-udev-rules).
#
# SCHEMA (per [[device]]):
#   match_type        "vid_pid" | "vid_pid_wildcard" (pid="*") | "usb_class"
#   usb_vid, usb_pid  lowercase hex strings; "" when match_type="usb_class"
#   class_code        "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor            silicon/OEM vendor name
#   soc_family        short chip-family/platform tag
#   soc_model         specific chip model(s) this pair is known to cover (may be a
#                     superset: several vendors do not vary the boot-mode PID by
#                     model, so model identity comes from the flashing tool's own
#                     post-connect handshake, not from the PID — see notes)
#   mode_name         human name of the boot/recovery mode
#   recommended_tool  the tool to dispatch to
#   confidence        "high" | "medium" | "low" (>=0.75 high, 0.45-0.74 medium,
#                     <0.45 low on the verified catalog's 0.0-1.0 source scale).
#                     Below "high" should not gate an irreversible action without
#                     an operator confirm.
#   notes             caveats, protocol notes, disambiguation from a similar entry

[[device]]
match_type = "vid_pid"
usb_vid = "04e8"
usb_pid = "685d"
class_code = ""
vendor = "Samsung Electronics"
soc_family = "Galaxy (Exynos and Qualcomm models)"
soc_model = "Galaxy (Exynos and Qualcomm models)"
mode_name = "Odin/download mode (Heimdall kPidGalaxyS2 0x685D)"
recommended_tool = "heimdall"
confidence = "high"
notes = "Generic download-mode id on most Galaxy devices. Heimdall is old; newer One UI models may need Odin/Odin4 -- not verified. A Qualcomm-SoC Galaxy device in EDL instead enumerates as the generic 05c6:9008 pair, a distinct mode triggered differently. Sources: Heimdall BridgeManager.h/.cpp, usb.ids, android-udev-rules."

