# wq#3940 — LIMPET HAL target device database: rockchip (17 entries)
# wq#3935 — ewf (e-waste-flasher) device-profile merge: per-entry
#           recommended_commands + partition_layout, and the shared
#           [partition_layouts.*] tables at the bottom of this file.
#
# Drop-in catalog for /etc/limpet/target-devices.d/. Built from the wq#3923 SoC
# boot-mode USB VID:PID research (ops/wq3809-limpet-hal/usb_boot_signatures.toml,
# research/WQ3923_USB_BOOT_MODE_SIGNATURES.md) reshaped into this ticket's
# per-vendor-family schema. Loaded by limpet/target_devices.py, which is what
# ops/wq3809-limpet-hal/hal.py's target_device plugin queries for real-time
# enrichment and what limpet/target-devices.d/91-limpet-targets.rules is generated
# from (python3 limpet/target_devices.py render-udev-rules).
#
# SCHEMA (per [[device]]):
#   match_type        "vid_pid" | "vid_pid_wildcard" (pid="*") | "usb_class"
#   usb_vid, usb_pid  lowercase hex strings; "" when match_type="usb_class"
#   class_code        "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor            silicon/OEM vendor name
#   soc_family        short chip-family/platform tag
#   soc_model         specific chip model(s) this pair is known to cover (may be a
#                     superset: several vendors do not vary the boot-mode PID by
#                     model, so model identity comes from the flashing tool's own
#                     post-connect handshake, not from the PID — see notes)
#   mode_name         human name of the boot/recovery mode
#   recommended_tool  the tool to dispatch to
#   confidence        "high" | "medium" | "low" — corroboration strength in the
#                     wq#3923 research corpus, NOT a live hardware verification.
#                     Below "high" should not gate an irreversible action without
#                     an operator confirm (same posture as usb_boot_signatures.toml).
#   notes             caveats, protocol notes, disambiguation from a similar entry
#
# OPTIONAL PROFILE FIELDS (wq#3935, ewf absorption — may be absent on
# not-yet-profiled entries in other vendor files):
#   recommended_commands  ordered operator playbook for this mode; <angle-bracket>
#                         tokens are operator-supplied values, never literal.
#                         MaskROM mode has NO flash verbs of its own — the first
#                         step is always chainloading the per-SoC loader blob
#                         (rkdeveloptool db), which flips the device to Loader.
#   partition_layout      name of a [partition_layouts.<name>] table below
#                         (loaded via limpet/target_devices.py
#                         load_partition_layouts). Layout confidence is the
#                         layout's own `confidence`, independent of the entry's.

[[device]]
match_type = "vid_pid"
usb_vid = "2207"
usb_pid = "290a"
class_code = ""
vendor = "Fuzhou Rockchip Electronics"
soc_family = "RK2928"
soc_model = "RK2928, RK3066"
mode_name = "MaskROM"
recommended_tool = "rkdeveloptool / upgrade_tool"
confidence = "medium"
notes = "RK3066 shares its MaskROM PID with the earlier RK2928 generation."
recommended_commands = [
    "rkdeveloptool db <per-SoC MiniLoaderAll.bin>  # chainload loader: MaskROM itself has no flash verbs",
    "rkdeveloptool ld  # confirm the device re-enumerated in Loader mode",
    "rkdeveloptool ppt  # print partition table",
    "rkdeveloptool rl 0x0 <total_sectors> full-backup.img  # full dump before any write",
]
partition_layout = "rk-legacy-parameter"

