# ---------------------------------------------------------------------------
# Shared partition layouts (wq#3935). Loaded by
# limpet/target_devices.py load_partition_layouts(); referenced from the
# entries above by name. Offsets are 512-byte-sector LBAs. These describe the
# vendor-standard image layout (what rkbin/U-Boot tooling writes) — a device
# running vendor Android firmware may instead carry whatever its parameter
# file declared, so `rkdeveloptool ppt` output, when the loader can produce
# it, always outranks this table for an attached device.
# ---------------------------------------------------------------------------

[partition_layouts.rk-gpt-standard]
description = "Rockchip standard GPT layout (RK3288 and later, rkbin/U-Boot convention): fixed loader offsets, GPT for everything from boot onward."
confidence = "medium"
source = "rkbin/U-Boot Rockchip docs convention per wq#3923 research corpus; not live-verified on hardware this pass"
partitions = [
    { name = "idbloader", start_sector = 64, notes = "0x40: DDR-init blob + miniloader (idbloader.img)" },
    { name = "uboot", start_sector = 16384, notes = "0x4000: U-Boot proper (uboot.img / u-boot.itb)" },
    { name = "trust", start_sector = 24576, notes = "0x6000: ATF/OP-TEE (trust.img); merged into the U-Boot FIT on newer mainline builds" },
    { name = "boot", start_sector = 32768, notes = "0x8000: kernel/boot partition; GPT-defined from here on" },
    { name = "rootfs", start_sector = 262144, notes = "0x40000: root filesystem" },
]

[partition_layouts.rk-legacy-parameter]
description = "Legacy Rockchip layout (pre-GPT Android era, RK2818..RK3188/RK3126/28): partition map is declared by the 'parameter' file, not a GPT."
confidence = "medium"
source = "Rockchip legacy parameter-file convention per wq#3923 research corpus; per-device map varies with firmware"
partitions = [
    { name = "idbloader", start_sector = 64, notes = "0x40: DDR-init blob + miniloader, same fixed offset as the GPT layout" },
    { name = "parameter", start_sector = 8192, notes = "0x2000: 'parameter' text file; its mtdparts string defines every later partition, offsets relative to this base. Dump and parse it (rkdeveloptool rl 0x2000 0x20 parameter.bin) instead of assuming names/offsets" },
]
