# wq#3940 — LIMPET HAL target device database: rockchip (27 entries)
# wq#3935 — ewf (e-waste-flasher) device-profile merge: per-entry
#           recommended_commands + partition_layout, and the shared
#           [partition_layouts.*] tables at the bottom of this file.
# wq#4190 — fully regenerated against the source-verified catalog
# /home/lumen/projects/limpet/data/usb-device-ids.toml (generated 2026-10-15,
# data/_src/gen_usb_ids.py). ISSUE-LOG #1365: the wq#3923 research pass this
# file was originally built from invented an "a/b generation-pair" PID
# convention (PID ending 'a' = MaskROM, same prefix ending 'b' = Loader of the
# *same* SoC) that does not match rkdeveloptool/U-Boot: each PID actually
# identifies one SoC, and MaskROM vs Loader on that SoC share the *same* PID,
# discriminated by bcdUSB bit0, not by a different PID. That fabricated
# convention produced four of the specific mislabels wq#4188 found (2207:300b
# called "RK3026 Loader", verified RK3168 MaskROM; 310b called "RK3126/28
# Loader", verified RK3188 MaskROM; 320b called "RK3368 Loader", verified
# RK3228/RK3229 MaskROM; 350b called "RK3328 Loader", verified RK3588 MaskROM)
# plus 330c (called "RK3288/RK3399 Loader", verified RK3399 MaskROM *and*
# Loader, same PID). It also fabricated 2207:360a/360b (RK3566/68) and
# 2207:380a/380b/390a/390b (RK3588/RK3528) point PIDs the verified catalog
# explicitly has no primary source for -- RK3528 is in that catalog's own
# "NOT VERIFIED -- deliberately absent" list, and RK3588/RK3566/68 are already
# correctly covered below at 350b/350a. All four are dropped. Twelve verified
# pairs that were missing outright are added: 281a, 292a, 292c, 301a, 310c,
# 310d, 320c, 330d, 330e, 110a, 110b, plus the Loader-mode duplicate entries
# for 320c/330c/350a/350b (same PID as their MaskROM entry, separate row per
# mode) and the UMS entry 0010.
#
# Drop-in catalog for /etc/limpet/target-devices.d/. Loaded by
# limpet/target_devices.py, which is what ops/wq3809-limpet-hal/hal.py's
# target_device plugin queries for real-time enrichment and what
# limpet/target-devices.d/91-limpet-targets.rules is generated from
# (python3 limpet/target_devices.py render-udev-rules).
#
# SCHEMA (per [[device]]):
#   match_type        "vid_pid" | "vid_pid_wildcard" (pid="*") | "usb_class"
#   usb_vid, usb_pid  lowercase hex strings; "" when match_type="usb_class"
#   class_code        "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor            silicon/OEM vendor name
#   soc_family        short chip-family/platform tag
#   soc_model         specific chip model(s) this pair is known to cover (may be a
#                     superset: several vendors do not vary the boot-mode PID by
#                     model, so model identity comes from the flashing tool's own
#                     post-connect handshake, not from the PID — see notes)
#   mode_name         human name of the boot/recovery mode
#   recommended_tool  the tool to dispatch to
#   confidence        "high" | "medium" | "low" — corroboration strength in the
#                     wq#3923 research corpus, NOT a live hardware verification.
#                     Below "high" should not gate an irreversible action without
#                     an operator confirm (same posture as usb_boot_signatures.toml).
#   notes             caveats, protocol notes, disambiguation from a similar entry
#
# OPTIONAL PROFILE FIELDS (wq#3935, ewf absorption):
#   recommended_commands  ordered operator playbook for this mode; <angle-bracket>
#                         tokens are operator-supplied values, never literal.
#                         MaskROM mode has NO flash verbs of its own — the first
#                         step is always chainloading the per-SoC loader blob
#                         (rkdeveloptool db), which flips the device to Loader.
#   partition_layout      name of a [partition_layouts.<name>] table below
#                         (loaded via limpet/target_devices.py
#                         load_partition_layouts). Layout confidence is the
#                         layout's own `confidence`, independent of the entry's.

[[device]]
match_type = "vid_pid"
usb_vid = "2207"
usb_pid = "281a"
class_code = ""
vendor = "Fuzhou Rockchip Electronics"
soc_family = "RK2818"
soc_model = "RK2818"
mode_name = "MaskROM"
recommended_tool = "rkdeveloptool / upgrade_tool"
confidence = "high"
notes = "Sources: usb.ids, rkdeveloptool RKScan.cpp."
recommended_commands = [
    "rkdeveloptool db <per-SoC MiniLoaderAll.bin>  # chainload loader: MaskROM itself has no flash verbs",
    "rkdeveloptool ld  # confirm the device re-enumerated in Loader mode",
    "rkdeveloptool ppt  # print partition table",
    "rkdeveloptool rl 0x0 <total_sectors> full-backup.img  # full dump before any write",
]
partition_layout = "rk-legacy-parameter"

