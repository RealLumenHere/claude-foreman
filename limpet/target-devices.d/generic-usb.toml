notes = "wq#4010: usb_vid=303a is Espressif's own registered VID — well-established maintainer/public knowledge (used throughout Espressif's and OpenOCD's udev rules) but NOT live-verified this session: fleet-search web is down fleet-wide (wq#2595, kb/ISSUE-LOG.md row 715+) and Frank's own S3 board is not attached to any host this fleet can reach to confirm with a real lsusb (wq#4036). pid is wildcarded on purpose: the peripheral's own default PID (USB-Serial-JTAG), a TinyUSB CDC app's PID, and ESP32 Bit Pirate's PID (which v1.7+ deliberately varies to dodge host-side caching, research/esp32s3-re-tools.md ADDENDUM A3) are three different firmware-chosen values under the same VID — VID:PID alone cannot distinguish them, same CDC-ambiguity class already documented for the generic FTDI/CH340 entries above. Confirm with lsusb (bus_interface string descriptor) or a protocol probe, not this table alone, before auto-dispatching a destructive tool."

