# many-passwords (many-passwords/many-passwords). wq#4087 addition to the wq#3930
# catalog -- SHIP. IoT/web-app default-credential list distinct from defaultcreds
# (ihebski) and ics-default-passwords: vendor network gear, routers, and admin panels
# (MySQL/PostgreSQL) rather than enterprise products or ICS/SCADA.
[source]
name = "many-passwords"
tier = "ship"
category = "creds"
summary = "many-passwords: default creds for IoT devices and web-app admin panels"
license = "GPL-2.0"
size = "<1 MB"

[ship]
format = "csv"
path = "creds/many-passwords.csv"
title_fields = ["Vendor", "Model/Software name"]
body_fields = ["Vendor", "Model/Software name", "Access Type", "Username", "Password", "Notes"]
