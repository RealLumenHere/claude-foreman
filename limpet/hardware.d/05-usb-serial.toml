[[device]]
name = "Prolific PL2303HX (original/older revisions)"
category = "usb-serial"
usb_ids = ["067b:2303"]
linux_driver = "pl2303"
in_kernel_since = "long-standing (pre-3.0)"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "None on Linux. The well-known PL2303 'driver stops working' problem is a Windows-driver chip-revision-detection issue (Prolific deliberately broke counterfeit HXA chips in their own Windows driver); Linux's pl2303 module detects chip revision generically and is not affected the same way."
confidence = "high"

[[device]]
name = "Prolific PL2303TA"
category = "usb-serial"
usb_ids = ["067b:2303"]
linux_driver = "pl2303"
in_kernel_since = "kernel 4.x added explicit TA-type revision detection to pl2303 (the chip shares the HX's VID:PID; the driver tells revisions apart internally via a type-detection routine, not via a distinct PID)"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "None on Linux. TA and HX share VID:PID 067b:2303; a pre-4.x kernel may misdetect a TA-revision chip. Not a concern for a current ISO build targeting a modern kernel."
confidence = "medium"
