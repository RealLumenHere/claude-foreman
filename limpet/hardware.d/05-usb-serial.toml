# Limpet hardware driver catalog — category: USB-serial bridges (wq#3924)
# See 01-flash-programmers.toml header for provenance/confidence notes. This category
# is the most settled of all twelve: every listed chip has had an in-kernel driver
# for over a decade, so these entries are "zero-config" for the ISO — no DKMS, no
# firmware blob. They're cataloged because other categories (Bus Pirate, JTAGulator,
# Tigard) key off these same drivers and VID:PIDs, and the HAL needs this table to
# disambiguate "bare FTDI chip" from "FTDI chip inside a Bus Pirate".

[[device]]
name = "FTDI FT232R"
category = "usb-serial"
usb_ids = ["0403:6001"]
linux_driver = "ftdi_sio"
in_kernel_since = "2.6.3x (ftdi_sio is one of the oldest USB-serial drivers in the tree)"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "None. Fully open, in-kernel."
confidence = "high"

[[device]]
name = "FTDI FT2232H"
category = "usb-serial"
usb_ids = ["0403:6010"]
linux_driver = "ftdi_sio (serial function) — tools needing MPSSE/JTAG mode (OpenOCD, iceprog) instead talk to the same chip via libftdi/libusb, bypassing ftdi_sio for that interface"
in_kernel_since = "2.6.3x"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "None. Fully open, in-kernel."
confidence = "high"

