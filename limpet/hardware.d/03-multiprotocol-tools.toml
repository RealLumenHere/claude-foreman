# Limpet hardware driver catalog — category: multi-protocol tools (wq#3924)
# See 01-flash-programmers.toml header for provenance/confidence notes.

[[device]]
name = "Bus Pirate v3"
category = "multiprotocol"
usb_ids = ["0403:6001"]
linux_driver = "ftdi_sio (in-kernel USB-serial driver)"
in_kernel_since = "2.6.3x (ftdi_sio predates current Bus Pirate hardware by a wide margin)"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = '''
# none required beyond default tty group access; Bus Pirate v3 enumerates as a
# generic FTDI FT232RL (VID:PID not reprogrammed on most units) at /dev/ttyUSBx
'''
proprietary_notes = "Fully open protocol/firmware. Because it reports the generic FTDI VID:PID, HAL cannot distinguish a Bus Pirate v3 from any other bare FT232R device by VID:PID alone — needs a protocol probe (send 0x00, expect BBIO1) to confirm identity."
confidence = "high"

[[device]]
name = "Bus Pirate v5"
category = "multiprotocol"
usb_ids = ["1209:7331"]
linux_driver = "cdc_acm (in-kernel) — native USB on RP2040, no FTDI bridge chip"
in_kernel_since = "cdc_acm is ancient; nothing device-specific needed"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-buspirate5.rules
SUBSYSTEM=="usb", ATTR{idVendor}=="1209", ATTR{idProduct}=="7331", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "Open hardware/firmware. VID:PID is a pid.codes-allocated pair (shared VID 1209); not live-verified against usb.ids this session — confirm before relying on it for silent auto-detection."
confidence = "low"

[[device]]
name = "Bus Pirate 6"
category = "multiprotocol"
usb_ids = ["1209:7331"]
linux_driver = "cdc_acm (in-kernel) — native USB CDC like v5, same RP2040-class MCU family"
in_kernel_since = "cdc_acm is ancient; nothing device-specific needed"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/90-limpet-buspirate-mcp.rules (installed by limpet-plugin-buspirate-mcp)
SUBSYSTEM=="usb", ATTR{idVendor}=="1209", ATTR{idProduct}=="7331", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "wq#4155: VID:PID confirmed from the DangerousPrototypes/BusPirate5-firmware source, which also builds the BP6 (src/platform/bpi6-rev2.c/h live in the same tree as the BP5 platform files). src/usb_descriptors.c:32-37 documents two pid.codes-registered pairs for this firmware family (1209:7331 'Bus Pirate Next Gen CDC', 1209:7332 'Bus Pirate Next Gen Logic Analyzer') and states the firmware is hard-coded to use the first — so BP6 enumerates identically to the Bus Pirate v5 entry above. This is read directly from the firmware source that sets idVendor/idProduct, not a live lsusb capture (no BP6 unit was reachable from this worker to attach and read lsusb directly); fleet-search web was down for independent corroboration (ISSUE-LOG rows 1315/1379)."
confidence = "medium"

[[device]]
name = "Glasgow Interface Explorer"
category = "multiprotocol"
usb_ids = ["1d50:6141"]
linux_driver = "none (userspace, libusb) — custom protocol, no kernel module"
in_kernel_since = "n/a"
firmware_blob = true
firmware_package = "bundled:glasgow"
firmware_note = "Uploaded to device RAM at runtime by the glasgow Python package itself — not a /lib/firmware blob and not part of linux-firmware."
dkms = false
dkms_source = "https://github.com/GlasgowEmbedded/glasgow (Python + Amaranth toolchain for the gateware; the host-side 'glasgow' CLI is a pip package, not a kernel module — nothing to DKMS-build)"
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-glasgow.rules (shipped in the glasgow repo)
SUBSYSTEM=="usb", ATTR{idVendor}=="1d50", ATTR{idProduct}=="6141", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "Fully open hardware/gateware/software. VID:PID taken from the OpenMoko-administered shared VID (1d50) block Glasgow registers under; not live-verified this session."
confidence = "medium"

