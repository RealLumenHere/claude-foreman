in_kernel_since = "2.6.3x"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-tigard.rules
SUBSYSTEM=="usb", ATTR{idVendor}=="0403", ATTR{idProduct}=="6010", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "Open hardware. Same generic-FT2232H VID:PID as plain Tigard-less FT2232H boards (including iCE40 dev boards, see 12-fpga-programmers.toml) — VID:PID alone cannot tell them apart; HAL must fall back to USB string descriptors or protocol probing."
