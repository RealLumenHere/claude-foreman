[[device]]
name = "Glasgow Interface Explorer"
category = "multiprotocol"
usb_ids = ["1d50:6141"]
linux_driver = "none (userspace, libusb) — custom protocol, no kernel module"
in_kernel_since = "n/a"
firmware_blob = true
firmware_package = "bundled:glasgow"
firmware_note = "Uploaded to device RAM at runtime by the glasgow Python package itself — not a /lib/firmware blob and not part of linux-firmware."
dkms = false
dkms_source = "https://github.com/GlasgowEmbedded/glasgow (Python + Amaranth toolchain for the gateware; the host-side 'glasgow' CLI is a pip package, not a kernel module — nothing to DKMS-build)"
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-glasgow.rules (shipped in the glasgow repo)
SUBSYSTEM=="usb", ATTR{idVendor}=="1d50", ATTR{idProduct}=="6141", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "Fully open hardware/gateware/software. VID:PID taken from the OpenMoko-administered shared VID (1d50) block Glasgow registers under; not live-verified this session."
confidence = "medium"

