# Limpet hardware driver catalog — category: network adapters (wq#3924)
# See 01-flash-programmers.toml header for provenance/confidence notes.
# wq#4093: all four devices here are in-kernel (no DKMS build). RTL8812BU was
# originally cataloged as needing an out-of-tree DKMS fork, but that
# dkms_source URL is dead and the in-kernel rtw88_8822bu already covers this
# chip (0bda:b812) on the pinned kernel ABI -- see that device's entry and
# driver_hook/dkms-sources.pin. MT7921U is in-kernel too (mt76 family); only
# its firmware blob needs bundling via linux-firmware, same as RTL8812BU's.

[[device]]
name = "ASIX AX88179 (USB3 Gigabit Ethernet)"
category = "usb-target"
usb_ids = ["0b95:1790"]
linux_driver = "ax88179_178a"
in_kernel_since = "3.8"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "None. Fully open, in-kernel."
confidence = "high"

[[device]]
name = "Realtek RTL8153 (USB3 Gigabit Ethernet)"
category = "usb-target"
usb_ids = ["0bda:8153"]
linux_driver = "r8152"
in_kernel_since = "3.16"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "None. Fully open, in-kernel."
confidence = "high"

[[device]]
name = "Realtek RTL8812BU (USB WiFi, 802.11ac dual-band)"
category = "usb-target"
usb_ids = ["0bda:b812"]
linux_driver = "rtw88_8822bu"
in_kernel_since = "wq#4093: the dkms_source below (github.com/morrownr/8812bu-20210629) returns 'Repository not found' -- that is the AU chip's repo, not this one. In-kernel rtw88_8822bu claims usb:v0BDApB812 (verified from the .ko in linux-modules-7.0.0-14-generic in the pinned ISO pool, and on the running 7.0.0-38 kernel). No DKMS build is needed; see driver_hook/dkms-sources.pin's skip entry."
firmware_blob = true
firmware_package = "linux-firmware"
firmware_note = "rtw88 ships this chip's firmware (rtw88/rtw8822b_fw.bin family) via linux-firmware, not via a DKMS build/install step."
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "Driver is in-kernel and open (rtw88_8822bu); the firmware blob is closed binary-only Realtek microcode, which is why it needs linux-firmware bundled rather than compiled. Catalog previously (incorrectly) pointed at an out-of-tree DKMS fork with a dead repo URL; if out-of-tree is ever wanted again, the candidate upstream is github.com/morrownr/88x2bu-20210702 (unvetted)."
confidence = "high"

[[device]]
name = "MediaTek MT7921U (USB WiFi, 802.11ax dual-band)"
category = "usb-target"
usb_ids = ["0e8d:7961"]
linux_driver = "mt76 family — specifically the mt7921u module"
in_kernel_since = "mainlined in the mt76 tree around 5.15-5.18 (USB variant trailed the PCIe mt7921e support by a couple of point releases); confirm against the exact kernel the ISO ships rather than assuming 6.x blanket coverage"
firmware_blob = true
firmware_package = "linux-firmware"
firmware_note = "Files under /lib/firmware/mediatek/mt7921/, e.g. WIFI_RAM_CODE_MT7961_1.bin and the WIFI_MT7961_patch_mcu_*.bin series — naming is shared across the mt7921/mt7961 family."
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = ""
proprietary_notes = "Driver is in-kernel and open; the firmware blobs are closed binary-only MediaTek microcode, which is why they need linux-firmware bundled rather than compiled. Confirm the ISO's target kernel is new enough — on anything older than ~5.15, this chip has no working in-kernel driver and would need vendor DKMS instead."
confidence = "medium"
