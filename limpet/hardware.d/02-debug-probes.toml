[[device]]
name = "CMSIS-DAP (generic HID probe, e.g. mbed/DAPLink boards)"
category = "debug-probe"
usb_ids = ["0d28:0204"]
linux_driver = "hidraw (generic in-kernel USB HID class) — no vendor-specific kernel module required"
in_kernel_since = "in-kernel generic HID/hidraw support predates all current CMSIS-DAP hardware (well before 2.6.3x); nothing CMSIS-DAP-specific is needed in-kernel"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-cmsis-dap.rules
SUBSYSTEM=="usb", ATTR{idVendor}=="0d28", ATTR{idProduct}=="0204", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "CMSIS-DAP is an open ARM spec; every compliant probe (DAPLink, Pico-Probe, etc.) shares the same HID access path, just with a different VID:PID per vendor/board. The VID:PID here is the common mbed/DAPLink one — treat others as unlisted-device sideload until confirmed."
confidence = "medium"

[[device]]
name = "Black Magic Probe"
category = "debug-probe"
usb_ids = ["1d50:6018"]
linux_driver = "cdc_acm (in-kernel USB CDC-ACM serial class driver) — exposes two ttyACM ports: GDB server + target UART"
in_kernel_since = "cdc_acm itself is ancient (pre-2.6.12); nothing device-specific needed beyond the generic class driver"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = ""
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-blackmagic.rules
SUBSYSTEM=="usb", ATTR{idVendor}=="1d50", ATTR{idProduct}=="6018", MODE="0660", GROUP="plugdev", TAG+="uaccess"
SUBSYSTEMS=="usb", ATTRS{idVendor}=="1d50", ATTRS{idProduct}=="6018", SYMLINK+="ttyBmpGdb", ENV{ID_USB_INTERFACE_NUM}=="00"
SUBSYSTEMS=="usb", ATTRS{idVendor}=="1d50", ATTRS{idProduct}=="6018", SYMLINK+="ttyBmpTarg", ENV{ID_USB_INTERFACE_NUM}=="02"
'''
proprietary_notes = "Fully open hardware and firmware; zero proprietary dependency. Plug-and-play on any kernel with CDC-ACM."
confidence = "high"
