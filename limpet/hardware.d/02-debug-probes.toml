# Limpet hardware driver catalog — category: debug probes (wq#3924)
# See 01-flash-programmers.toml header for provenance/confidence notes (same source
# limitation: fleet-search web down, wq#2595).

[[device]]
name = "Segger J-Link (BASE/EDU/PLUS, all V8-V12 variants)"
category = "debug-probe"
usb_ids = ["1366:0101", "1366:0105", "1366:1020"]
linux_driver = "none (userspace, libusb) — proprietary bulk-transfer protocol"
in_kernel_since = "n/a"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = "https://github.com/afaff/libjaylink (open client lib used by OpenOCD's jlink adapter; not a kernel module)"
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/60-jlink.rules (SEGGER ships an equivalent rule with JLinkExe)
SUBSYSTEM=="usb", ATTR{idVendor}=="1366", MODE="0660", GROUP="plugdev", TAG+="uaccess"
'''
proprietary_notes = "Full feature set (RTT, flash breakpoints, licensed targets) requires SEGGER's closed-source J-Link software/driver package. OpenOCD + libjaylink cover core JTAG/SWD for open workflows but trail SEGGER's own tooling on niche targets."
confidence = "high"

[[device]]
name = "ST-Link V2"
category = "debug-probe"
usb_ids = ["0483:3748", "0483:374b"]
linux_driver = "none (userspace, libusb)"
in_kernel_since = "n/a"
firmware_blob = false
firmware_package = "none"
dkms = false
dkms_source = "https://github.com/stlink-org/stlink (userspace st-flash/st-util CLI; OpenOCD also talks to it directly)"
dkms_build_estimate_minutes = 0
udev_rule = '''
# /etc/udev/rules.d/49-stlinkv2.rules (shipped upstream by stlink-org)
SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="3748", MODE="0666", GROUP="plugdev"
SUBSYSTEM=="usb", ATTR{idVendor}=="0483", ATTR{idProduct}=="374b", MODE="0666", GROUP="plugdev"
'''
proprietary_notes = "Fully open: ST's protocol was reverse-engineered years ago and is well covered by stlink-org/stlink and OpenOCD."
confidence = "high"

