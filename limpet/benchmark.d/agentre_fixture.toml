# wq#3997 -- OFFLINE FIXTURE modeling the AgentRE-Bench (agentre-bench.ai) task schema.
#
# This is NOT the vendored published dataset. The real task set must be fetched over the
# network, which the build sandbox cannot do (fleet-search web down fleet-wide, wq#2595) --
# see design/wq3997_limpet_re_benchmark.md "held back". These tasks exist so the eval
# instrument (limpet/benchmark.py) is runnable and tested today, and to pin a falsifiable
# fixture for the acceptance probe. They lean firmware/hardware on purpose, matching the
# appliance's emphasis and the benchmark-selection criterion in the design doc.
#
# Each [[task]] is one agentic-RE task: the agent is given `prompt` about a target and must
# produce the `expect` answer map. `grade` = subset (default) credits the task only when every
# expected key is present and correct; `target_class` groups firmware vs binary in the report.

[benchmark]
name = "agentre-bench"
source = "agentre-bench.ai"
arxiv_survey = "2604.14317"
note = "offline fixture modeling the published schema; real dataset vendored separately (queued)"

[[task]]
id = "re-fw-soc-id"
name = "identify SoC family + boot mode from a USB descriptor"
target_class = "firmware"
prompt = "A device enumerated at VID:PID 2207:0006. Name its SoC family and USB boot mode."
grade = "subset"
expect = { soc_family = "rockchip", boot_mode = "maskrom" }

[[task]]
id = "re-fw-partition"
name = "recover the partition layout of a vendor update image"
target_class = "firmware"
prompt = "Given rk3399_update.img, report the flash offset (hex) of the 'boot' partition and the image load address."
grade = "subset"
expect = { boot_offset = "0x4000", load_address = "0x00200000" }

[[task]]
id = "re-fw-crypto"
name = "locate the firmware signature-check routine"
target_class = "firmware"
prompt = "In /sbin/fwupd, name the hash the update verifier uses and whether a mutable flag can bypass the check."
grade = "subset"
expect = { hash = "sha256", bypassable = "yes" }

[[task]]
id = "re-bin-license"
name = "defeat a user-space license check (CrackMeBench-style)"
target_class = "binary"
prompt = "crackme_07 rejects every key. Name the comparison the check hinges on and a key that passes it."
grade = "subset"
expect = { comparison = "strcmp", passing_key = "AGENTRE-OK" }

[[task]]
id = "re-bin-strings"
name = "extract a hardcoded credential from a stripped binary"
target_class = "binary"
prompt = "The stripped ARM binary 'telnetd' embeds a backdoor account. Report the username and password storage."
grade = "contains"
expect = { username = "admin", password_storage = "plaintext" }
