<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Limpet workspace manager">
  <!-- Workspace manager app icon, docs/branding-spec.md §2.1 palette. Flat token
       colors: surface #152221 cards, panel #1C2B2A back card, primary #3EC5F0
       active-workspace dot, muted #7A8C8A inactive. Motif: stacked workspace
       cards, the active one marked by the signature blue ray dot. -->
  <!-- back/inactive cards -->
  <rect x="9" y="9"  width="24" height="17" rx="3" fill="#1C2B2A" stroke="#7A8C8A" stroke-width="1.3"/>
  <rect x="13" y="15" width="24" height="17" rx="3" fill="#152221" stroke="#7A8C8A" stroke-width="1.3"/>
  <!-- front/active card -->
  <rect x="11" y="22" width="26" height="18" rx="3" fill="#152221" stroke="#3EC5F0" stroke-width="1.8"/>
  <!-- active-card header line + status dots -->
  <rect x="15" y="27" width="14" height="2.2" rx="1.1" fill="#D6E2DF"/>
  <circle cx="33" cy="28" r="2.1" fill="#3EC5F0"/>
  <rect x="15" y="33" width="10" height="2.2" rx="1.1" fill="#7A8C8A"/>
  <circle cx="30" cy="34" r="1.6" fill="#5FA876"/>
</svg>
