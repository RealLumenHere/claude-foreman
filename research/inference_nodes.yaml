    power_reason: "Frank 2026-09-20: hathor stays up while the group needs it (wq#2796 2026-09-26: dedicated to the judge instead, still always-on)"
    cores: 12
    ram_gb: 64
    idle_watts: 86.6               # research/ISIS_POWEROFF_RCA.md:25
    wake:
      method: plug-ac
      mac: "00:3e:e1:c9:07:48"     # enp12s0, fleet LAN (research/INVENTORY_RECONCILIATION.md:117); wq#3650
      measured_ready_s: null
      last_measured: null
    models:
      - family: hathor-llama8b
        resident: true
        slots: 2
        served_ctx: 32768
        first_frame_s: 1500
        prefill_tps: 13.6
        decode_tps: null
        measured_at: 2026-09-20
        load_s: null
        # wq#2796: dedicated to the judge (research/RISK_TIERED_JUDGE.md §4) -- excluded from the
        # `local-worker` LiteLLM least-busy group so batch/fworker traffic can't land on Hathor's
        # 2 ollama slots and contend with a synchronous judge call. Still individually addressable
        # as `hathor-llama8b` (bin/judge's pin) and still counted for dispatcher/models.yaml local
        # capacity -- this flag affects target 1 (gateway model_list) only.
        local_worker_group: false
        capabilities:
          mechanical-edit:      {trusted: true, source: declared, ref: "harness/fworker.py:160"}
          probe-build:          {trusted: true, source: declared, ref: "harness/fworker.py:160"}
          standard-engineering: {trusted: true, source: declared, ref: "harness/fworker.py:179-182"}
      # wq#3667: qwen2.5-coder:7b on hathor. 1 slot (judge box, wq#2796). Not in local-worker.
