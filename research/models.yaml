# models.yaml — claude-foreman capability manifest (DRAFT, foreman-r1 2026-08-14)
# CAL-1 partial close, wq#750 2026-08-22: every `burn` now carries a `measured:` block from
# 149 real launches (_runs/*/attempt-*.json, 2026-08-15..22). Two caveats bind every figure:
#   1. TOKENS ARE UNMEASURED. ~/.claude/projects transcripts are guard-denied and the journal
#      records no usage fields, so `measured_tokens: null` everywhere. The `est:` strings and
#      api_price_mtok rows stay — nothing available can retire them.
#   2. 117/149 launches (79%) hit max_turns. Every turns/elapsed/cpu figure is CENSORED at
#      the cap, not a natural completion cost. Do not read cross-tuple deltas as capability.
#   3. wq#619 2026-09-20: `measured_usage:` is the %-delta of the account-global pools around ONE
#      serial scratch-fixture run (harness/cal1_fixture.py, n=1, 1pt resolution, peak hours, other
#      fleet traffic unattributed). Read +1 as "<~2pt", not as a cost. Only sonnet-5@low so far;
#      widen with `cal1_fixture.py run-matrix` + `apply` off-peak.
# Full analysis + per-surface fleet audit: research/MODEL_ROUTING_AUDIT.md.
# Effort names are the CLI strings: low|medium|high|xhigh|max. Frank scale: 1..5 = those, in order.
# Sources: FOREMAN_RESEARCH.md §2/§3/§10 (citations live there).

pools:
  session:        {kind: five_hour,     source: oauth_usage, note: "account-global 5h rolling; opens on first metered message; weekday 05-11 PT burns faster"}
  weekly_all:     {kind: seven_day,     source: oauth_usage, note: "temporary raised ceiling ends 2026-08-19"}
  fable_weekly:   {kind: weekly_scoped, source: oauth_usage, match: "scope.model.display_name ~ /fable|mythos/", cap: "50% of weekly_all, included on Max since 2026-07-20"}
  local:          {kind: none,          source: litellm,     note: "genuine local compute: the local-worker group over hathor-llama8b, nephthys-qwen14b and qwen36-local (Isis 100.100.129.24, out of service), bounded by those boxes' CPU/GPU only"}
  cheap_cloud:    {kind: none,          source: litellm,     note: "wq#777 2026-08-23: split out of 'local' (MODEL_ROUTING_AUDIT.md F4). Paid external API behind the same LiteLLM gateway (deepseek-v4-flash -> api.deepseek.com): ZERO Anthropic quota and governor-exempt like genuine local compute, but bounded by the vendor's own rate limits, not Lumen/Isis hardware."}
  # P3 pins exact field names; CCC claude.ai limits[] is the fallback mapping (kind session|weekly_all|weekly_scoped, percent 0..100).

defaults:
  reserve_floors: {session: 0, weekly_all: 0, fable_weekly: 0}   # REMOVED per Frank 2026-08-23 (3rd instruction): 3-concurrent is the only real limit, no weekly/session gating
  concurrency:    {cloud_max: 3, local_max: 12}
  offpeak_bias:   "avoid new cloud dispatch weekdays 05:00-11:00 PT"
  autocompact_window: 500000   # fable/opus/sonnet workers

models:
  - id: claude-fable-5
    alias: fable            # DEFAULT fable = 5.0 (reverted 2026-09-02, ISSUE-LOG #38: 5.1 usage unmeasured, may burn MORE). also `best` where available; [1m] row exists (native 1M anyway)
    status: LIVE            # needs CC >=2.1.170; we run 2.1.220
    context: 1M native
    efforts: [low, medium, high, xhigh, max]
    default_effort: high
    pools: [session, weekly_all, fable_weekly]
    burn:
      est: "~2x opus per in-app UI note"
      measured_tokens: null            # see header caveat 1
      measured: "P2 2026-08-14: fable@max emitted 263 out-tokens for a trivial prompt vs 4 for
        opus5/sonnet5 no-effort; +1pt Fable weekly_scoped from one call.
        wq#750 2026-08-22, n=4 launches (fable-5@high only): highest per-launch cost on the
        fleet by a wide margin — novel-design 2/2 SUCCESS at 698.2s median wall-clock /
        75.6s median cpu / 64 median turns, vs opus-5@high novel-design 205.4s / 17.9s.
        standard-engineering 0/2 (both capped), which is direct support for the
        'never a volume worker' trust line below."
    api_price_mtok: {in: 10, out: 50}
    quirks: ["thinking cannot be disabled", "cyber-flag -> auto-fallback opus-4-8, bio-flag -> opus-5",
             "-p bills usage credits WITHOUT consent prompt if entitlement says credits (ours: included; stale-entitlement bug #79337 -> restart)",
             "model-default effort hold on first run -> always pass --effort"]
    trust: "orchestrator sessions; novel-design; escalated RCA. Never a volume worker."

  - id: claude-fable-5-1
    alias: fable-5-1        # NOT the default. 5.1-vs-5.0 usage is OPEN until measured (ISSUE-LOG #38); Frank observed 5.1 may burn MORE
    status: LIVE            # needs CC >=2.1.251; we run 2.1.258 (updated 2026-09-02)
    context: 1M native
    efforts: [low, medium, high, xhigh, max]
    default_effort: high
    pools: [session, weekly_all, fable_weekly]
    burn:
      est: "UNMEASURED vs fable-5 — do not assert a usage cut until usage-*.json records model+tokens (ISSUE-LOG #38)"
      measured_tokens: null            # see header caveat 1
      measured: "P2 2026-08-14: fable@max emitted 263 out-tokens for a trivial prompt vs 4 for
        opus5/sonnet5 no-effort; +1pt Fable weekly_scoped from one call.
        wq#750 2026-08-22, n=4 launches (fable-5@high only): highest per-launch cost on the
        fleet by a wide margin — novel-design 2/2 SUCCESS at 698.2s median wall-clock /
        75.6s median cpu / 64 median turns, vs opus-5@high novel-design 205.4s / 17.9s.
        standard-engineering 0/2 (both capped), which is direct support for the
        'never a volume worker' trust line below."
    api_price_mtok: {in: 10, out: 50}
    quirks: ["thinking cannot be disabled", "cyber-flag -> auto-fallback opus-4-8, bio-flag -> opus-5",
             "-p bills usage credits WITHOUT consent prompt if entitlement says credits (ours: included; stale-entitlement bug #79337 -> restart)",
             "model-default effort hold on first run -> always pass --effort"]
    trust: "orchestrator sessions; novel-design; escalated RCA. Never a volume worker."

  - id: claude-opus-5
    alias: opus             # default model on Max since CC 2.1.219
    status: LIVE
    context: 1M (auto-upgrade included on Max)
    efforts: [low, medium, high, xhigh, max]
    default_effort: high    # no cross-session effort hold (unlike fable/4.8/4.7)
    pools: [session, weekly_all]   # seven_day_opus meter exists in vocab; enforcement on Max = P3
    burn:
      est: "opus-class; > sonnet, < fable"
      measured_tokens: null
      measured: "wq#750 2026-08-22, n=34 launches. rca-investigation@xhigh: 1/11 SUCCESS,
        10 capped, 65 median turns, 532.9s median wall-clock, 25.8s cpu — the priciest
        routed rung by wall-clock. research-synthesis@high: 1/17 SUCCESS, 15 capped, 30
        median turns, 128.0s. NO measured advantage over sonnet-5@high on either archetype
        (rca sonnet 0/4, research-synthesis sonnet 0/2) — but both comparisons are
        cap-censored, so this is 'unproven', NOT 'opus is unnecessary'. See
        MODEL_ROUTING_AUDIT.md §3 F1/F2."
    api_price_mtok: {in: 5, out: 25}
    quirks: ["bio-flag -> refusal (no fallback)", "cyber-flag -> opus-4-8"]
    trust: "RCA-investigation; research-synthesis; escalation target from sonnet."

  - id: claude-sonnet-5
    alias: sonnet
    status: LIVE            # needs >=2.1.197
    context: 1M native (no [1m] variant; autocompacts ~967K default)
    efforts: [low, medium, high, xhigh, max]
    default_effort: high
    pools: [session, weekly_all]
    burn:
      est: "workhorse-class; sonnet@high assumed ~= opus@low cost, better value"
      measured_tokens: null
      measured_usage: {low: {pct_delta: {fable_weekly_scoped: +0, session: +1, weekly_all: +0}, tokens: null, n: 1}}   # CAL-1 wq#619
      measured: "wq#750 2026-08-22, n=111 launches (75% of all fleet dispatch — the workhorse
        claim holds). standard-engineering@high: 8/68 SUCCESS, 49 capped, 44 median turns,
        221.8s median wall-clock, 15.8s cpu. mechanical-edit@low: 3/5 SUCCESS at 19 median
        turns / 42.4s — the cheapest and highest-yield tuple measured. verify-pass@high:
        0/12, all 12 capped at max_turns 25 (turn-starved, not model-limited)."
    api_price_mtok: {in: 3, out: 15, cache_read: 0.30, cache_write: 6.00, note: "CALL_AUDIT.md (wq#706) solved these vs CLI-reported total_cost_usd, 0.0 relative error across 5 clean-set sessions — CLI bills 3/15 now, not the intro 2/10 rate"}
    trust: "standard-engineering; probe-build; mechanical-edit; verify-pass gate model."

  - id: claude-haiku-4-5
    alias: haiku            # pin claude-haiku-4-5; alias carries no version guarantee
    status: LIVE
    context: 200K
    efforts: []             # no effort support — launch without --effort
    pools: [session, weekly_all]
    burn:
      est: "cheapest cloud"
      measured_tokens: null
      measured: "wq#750 2026-08-22: ZERO launches in 149. Not classifier over-ranking —
        haiku is the primary for no archetype, and the chain after a primary is walked only
        on governor pressure, never on attempt count (verified by executing
        `router.py route probe-build --fails 0|1|2` -> sonnet-5@medium every time;
        `--pressure claude-sonnet-5=deny` -> claude-haiku-4-5). Pressure never fired:
        saw_limit 0/149, session utilisation 13%. Reachable, correctly wired, dead in
        practice."
    quirks: ["always available / cannot be org-disabled", "different shape, not just cheaper"]
    trust: "archetype 1-2 only; classification chores. Measured wq#780 (2026-08-22,
      N=4 matched probe-build/mechanical-edit pairs, same 600-turn ceiling both arms):
      SUCCESS 4/4 on both haiku and sonnet-5@low, output verified equivalent (tests
      passed) on every pair; haiku ran ~44% longer wall-clock on average (mean 73s vs
      51s per pair, range +10% to +58%). No correctness edge for haiku, measurably
      slower, only cheaper — stays the downgrade rung behind sonnet@low, not a primary.
      Small-N calibration; see research/CAL1_HAIKU_VS_SONNET_LOW.md."

  # LISTED-NOT-ROUTED (pin targets / fallback landing zones; no price or capability edge on subscription)
  - {id: claude-opus-4-8,  status: LIVE,      efforts: [low,medium,high,xhigh,max], note: "Fable cyber-fallback target; api 5/25"}
  - {id: claude-opus-4-7,  status: LIVE-probe, efforts: [low,medium,high,xhigh,max], note: "xhigh was its default; P1 confirms picker"}
  - {id: claude-opus-4-6,  status: LIVE-probe, efforts: [low,medium,high,max],       note: "no xhigh; P1 confirms"}
  - {id: claude-sonnet-4-6, status: LIVE,     efforts: [low,medium,high,max],        note: "1M needs credits (closed for us)"}
  - {id: claude-3-opus-20240229, status: TOMBSTONE-CONFIRMED, note: "P1 live 2026-08-14: shows in picker but does NOT serve (is_error, model may-not-exist/no-access, EOL Jan 5 2026). Unroutable."}
  - {id: claude-mythos-5,  status: NOT-OURS,  note: "approved-orgs only; the reserved T02 slot in the intended roster"}

