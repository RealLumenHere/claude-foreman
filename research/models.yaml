routing:   # archetype -> primary -> downgrade path (effort first, then model). Details RESEARCH §15.
  # wq#777 2026-08-23 (MODEL_ROUTING_AUDIT.md F4): local-first. Measured 0/149 foreman
  # launches used the local rung though Isis was reachable the whole time; mechanical-edit
  # is the cheapest/highest-yield archetype measured (3/5 SUCCESS, 19 median turns, 42.4s
  # for sonnet-5@low), so it carries the bounded downside best. The local-authored diff
  # still goes through the mandatory sonnet-5 verify-pass gate
  # (verify_pass.local_author_always, true). router.py's wq#779 F3 fails-walk advances the
  # base chain one rung per recorded fail, so a hung backend costs at most one failed
  # attempt before a ticket lands on cloud sonnet, not a standing outage.
  # wq#2133 (dispatch rebuild 10/12): the local rung is the `local-worker` group, not one
  # box. router.select skips a rung whose model status is not LIVE* or whose backend sits in
  # runtime/backend_cooldown.json, so a cooled-down group lands on the cloud rung behind it.
  # qwen36-local (status down, 8k ctx) is no longer primary. probe-build's haiku row = CAL-1.
  mechanical-edit:      [local-worker@local, sonnet-5@low]
  probe-build:          [local-worker@local, sonnet-5@medium, haiku-4-5]
  standard-engineering: [sonnet-5@high,   sonnet-5@medium, opus-5@medium(escalate-on-fail)]
  rca-investigation:    [opus-5@xhigh,    opus-5@high, fable-5@high(2-fails-or-cross-subsystem)]
  novel-design:         [fable-5@high]    # design doc only; execution re-ticketed
  long-horizon-campaign: [DECOMPOSE]      # orchestrator splits; never one worker
  research-synthesis:   [opus-5@high,     sonnet-5@high]
  verify-pass:          [sonnet-5@high,   opus-5@high(on-contradiction)]
  fire-response:        [sonnet-5@high,   opus-5@high(escalate-on-fail)]   # wq#717 AUTO-5: fleet-fires manual-approval; never local (LOCAL_ALLOWED_ARCHETYPES excludes it)
  orchestrator:         [fable-5@high]    # fable-5@max reserved for hardest investigations until CAL data justifies more

# wq#2133: when true, standard-engineering gets local-worker@local prepended (router.Manifest.chain).
# Flip only after the local tok/s numbers: warm eval >= 40 tok/s, or the slim prompt under 6k tokens.
local_standard_engineering: false

dominated_never_select:
  - fable-5@low
  - fable-5@medium
  - "all opus-4-x and sonnet-4-6 tuples while 5-gen sibling selectable"
  - sonnet-5@xhigh (archetypes 1-2)
  - sonnet-5@max   (archetypes 1-2)
  - opus-5@low     # provisional — CAL-1 tests sonnet-5@high against it

# ── refusal-fallback routing (decompiled from 2.1.220, SRC FQt) ──
# When a model refuses (stop_reason "refusal"), CC silently retries the turn on:
refusal_fallback:
  default:                 # refusing model = fable-5 / most
    bio:   claude-opus-5
    cyber: claude-opus-4-8
  when_refusing_is_opus5:  # opus-5 / opus-5[1m]
    cyber: claude-opus-4-8
    bio:   null            # no fallback → hard refusal
  keep_entitled: [claude-opus-4-8]   # cyber landing zone for every tier — must stay selectable
  disable_env: CLAUDE_CODE_DISABLE_REFUSAL_FALLBACK
  in_print_mode: "no consent dialog; mapped retry is automatic or errors"
  supervisor_watch: [model_refusal_fallback, model_refusal_no_fallback, model_fallback, api_retry]

# ── effort resolution (decompiled, SRC Uoe) ──
effort_resolution:
  ladder: [low, medium, high, xhigh, max]   # UI slot4 label "Extra" == wire "xhigh"
  precedence: [CLAUDE_CODE_EFFORT_LEVEL_env, "cli --effort / settings effortLevel", model_default]
  env_pin: "CLAUDE_CODE_EFFORT_LEVEL=<name> beats --effort; names only, never integers"
  launch_pin_models: [fable-5, opus-4-8, opus-4-7]   # first run holds default until explicit --effort
  clear_pin: "pass explicit --effort (runs yW(), clears all pins globally)"
  ceilings:            # SRC OI/eqe/I_e exclusion lists
    full_incl_xhigh_max: [fable-5, opus-5, opus-4-8, opus-4-7, sonnet-5]
    max_no_xhigh:        [opus-4-6, sonnet-4-6]      # xhigh silently -> high
    none:                [haiku-4-5]
  downgrade_rule: "unsupported max->high, unsupported xhigh->high (never adjacent tier)"
  verify: "actual per-turn effort = $CLAUDE_EFFORT env / hook effort.level / get_settings.applied.effort"

# ── entitlement + usage sources (decompiled) ──
sources:
  entitlement: "GET /api/claude_cli/bootstrap -> model_access[]{api_name,entitled,max_effort_level}"
  usage_inband: "stream-json rate_limit_event{status,rateLimitType,resetsAt,utilization} + api_error.rate_limits"
  usage_snapshot: "get_usage -> rate_limits{five_hour,seven_day,seven_day_opus,seven_day_sonnet,model_scoped[],extra_usage}"
  limit_classifier: "error result + (rate_limit_event.rejected | api_error.rate_limits!=null | cat==rate_limit) => LIMIT"
  autocompact_env: CLAUDE_CODE_AUTO_COMPACT_WINDOW   # highest precedence; set 500000 for cloud workers

# ── orchestrator tier policy (wq#617, T3) — read by orchestrator/router.py + judgment.py ──
verify_pass:            # archetype 8: adversarial re-check of a SHIPPED diff (FOREMAN_RESEARCH §15)
  tuple: sonnet-5@high
  escalate_on_contradiction: opus-5@high
  distinct_model_alternate: opus-5@high   # used only when prefer_distinct_model AND author was sonnet-5
  prefer_distinct_model: false            # doctrine: fresh INSTANCE always; distinct MODEL "where possible" —
                                          # opus-5@high is the only ≠-sonnet verifier we trust, and paying opus
                                          # for every sonnet diff is a CAL-1 question. Flip after calibration.
  required_for: [rca-investigation, standard-engineering]   # every shipped diff of these archetypes
  local_author_always: true               # T4 rung: any archetype authored on the local pool needs the gate
  never_for: [verify-pass, research-synthesis, novel-design, long-horizon-campaign]
  lane: build
  pri: 2

judgment:               # Fable-5@high orchestrator judgment sessions (BUILD_PLAN §T3)
  tuple: fable-5@high
  max_tuple: fable-5@max
  max_reserved_until: CAL-1               # @max only for `hardest-investigation` triggers until routing rows carry measured[]
  cadence_hours: 6                        # a judgment session is due this long after the last one ...
  cadence_tickets_closed: 8               # ... or after this many tickets closed since, whichever first
  burn_down_triggers:                     # any of these makes a session due NOW (checked by judgment.py due)
    - ticket_blocked_twice                # a ticket hit 2 failed attempts (fworker wq block)
    - verify_contradiction                # a verify-pass contradicted its author
    - rca_cross_subsystem                 # an rca ticket escalated on cross-subsystem blast radius
    - governor_floor_breach               # T1 state.json floor_breaches non-empty
    - decompose_needed                    # router returned DECOMPOSE for a claimable ticket
    - refusal_no_fallback                 # a worker turn ended in model_refusal_no_fallback
  hardest_investigation_triggers: [rca_cross_subsystem]   # the only path to @max, and only once CAL-1 lands
  min_gap_minutes: 60                     # never two judgment sessions closer than this
  quiet_hours_pt: "05:00-11:00 weekdays"  # cadence sessions wait for off-peak; burn-down triggers do not
