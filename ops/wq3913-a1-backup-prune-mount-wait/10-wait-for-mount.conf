# wq#3913: lumen-backup-prune.service FAILED 2026-10-14 06:32Z (errors=1).
# Root cause: the 06:20:25 run started 9s after kernel boot (boot ID
# 878047020e0f41ce8ad99776eb4d6fda started 06:20:16; prior boot's last entry
# was 06:19:08 — a reboot), but /mnt/lumen-backup (external USB drive,
# /dev/sda1) didn't finish mounting until 06:51:36 — 31min later
# (`systemctl status mnt-lumen\x2dbackup.mount`: Active since 06:51:36 UTC).
# backup-prune.sh's REPO_LOCAL=/mnt/lumen-backup/restic-local was an empty
# mountpoint at 06:20:25, so restic failed forget(critical) and
# forget(important) with "repository does not exist" (confirmed in
# /home/lumen/services/backup/logs/prune-20261014.log). RequiresMountsFor
# orders this unit after the mount unit covering that path and requires it
# to be active first, so any boot-time run waits instead of racing it.
[Unit]
RequiresMountsFor=/mnt/lumen-backup
