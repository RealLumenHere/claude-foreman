# Install as: /etc/systemd/system/dc-gateway.service.d/dc-gateway-hardening.conf
# T1 hardening, per MCP_CONTROL_PLANE_HA_DESIGN.md #3.3 (same class fix applies
# whether the pool is Lumen/Anubis/Bes or the P1 pair): CPUWeight/IOWeight so
# a busy box can't starve the control plane, MemorySwapMax to stop an OOM
# spiral from filling swap, Nice/OOMScoreAdjust so the kernel kills something
# else first. VALUES BELOW ASSUME <=4GB RAM (Station P1 Pro base config) --
# once `free -h` on the real box is known, adjust MemoryHigh/Max in
# dc-gateway.service (not here) to actual-RAM * 0.5 / * 0.7.
[Service]
CPUWeight=1000
IOWeight=1000
MemorySwapMax=512M
Nice=-5
OOMScoreAdjust=-900
