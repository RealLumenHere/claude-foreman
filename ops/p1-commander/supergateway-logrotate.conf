# Install as: /etc/logrotate.d/supergateway
# wq#2606: broadens wq#1698's single-file supergateway-desktop-commander
# logrotate proposal (never applied — file is 64MB today, unrotated) to a
# glob so it also covers any other local supergateway instance (e.g. a
# mcp-server-memory gateway on :3104, or the dc-gateway units this same
# watchdog ships to on Anubis/Bes/Nephthys) without a per-service edit.
/home/__NODE_USER__/logs/supergateway/*.log {
    size 50M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0600 __NODE_USER__ __NODE_USER__
}
