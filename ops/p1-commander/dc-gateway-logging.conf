# Install as: /etc/systemd/system/dc-gateway.service.d/dc-gateway-logging.conf
# Parity with Lumen's no-body-logs-journald.conf (wq#1698): supergateway logs
# every MCP request/response body at --logLevel info (the default). Route
# stdout to a local, permission-restricted, size-capped file instead of
# journald -- secrets-at-rest, same reasoning as Lumen. The log file must
# exist at mode 0600 owner __NODE_USER__:__NODE_USER__ BEFORE this drop-in
# takes effect (systemd's `append:` target does not create-with-mode --
# install.sh does this). Pair with supergateway-logrotate.conf.
[Service]
StandardOutput=append:/home/__NODE_USER__/logs/supergateway/dc-gateway.log
StandardError=journal
