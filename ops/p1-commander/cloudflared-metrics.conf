# Install as: /etc/systemd/system/cloudflared.service.d/wq2606-metrics.conf
# wq#2606: exposes the tunnel's local metrics/health server on :20241 so the
# watchdog's cloudflared probe (GET /ready) has something to hit. ExecStart=
# must be cleared before being redefined in a drop-in.
[Service]
ExecStart=
ExecStart=/usr/bin/cloudflared --no-autoupdate --config /etc/cloudflared/config.yml --metrics localhost:20241 tunnel run
