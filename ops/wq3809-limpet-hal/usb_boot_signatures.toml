# wq#3923 — SoC boot-mode USB VID:PID detection signatures.
#
# Comprehensive map of USB VID:PID (and, where the real signal is a USB interface
# class rather than a vendor ID, class-code) pairs for SoCs/MCUs in
# recovery/download/flashing boot modes. This is the data `usb_boot_signatures.py`
# loads for the HAL `target_device` plugin (ops/wq3809-limpet-hal/hal.py) and for the
# Target Device Wizard's IDENTIFY stage usb-vid-pid evidence source
# (docs/target-wizard-spec.md:88, weight 0.9 on a plugin-manifest match / 0.6 on a
# bare usb.ids match — `confidence` below feeds that same scale).
#
# SOURCING: compiled from the on-disk device tables of the per-vendor open-source
# flashing tools named in `recommended_tool` (mtkclient, edl/qdl, rkdeveloptool,
# pyamlboot, sunxi-fel, Heimdall, dfu-util, rpiboot) plus each silicon vendor's own
# USB-IF VID assignment, as carried in this agent's training corpus. Live
# cross-checking against upstream source (fleet-search web/github) was unavailable
# this run: web search is down fleet-wide (all 4 SearXNG engines
# suspended/CAPTCHA'd, no BRAVE_API_KEY — wq#2595, open) and `fleet-search github`
# returns 401 (no usable token) — both pre-existing, logged outages, not new issues.
# See research/WQ3923_USB_BOOT_MODE_SIGNATURES.md for the full sourcing note.
#
# `confidence` (0.0-1.0) reflects how independently-corroborated each pair is in that
# corpus, NOT a live verification — treat exactly like any other identification
# evidence under the wizard's §4.3 gate (docs/target-wizard-spec.md:171-184): entries
# below 0.85 should not gate an irreversible action (flash write, mass-erase) without
# an operator confirm, same as any other `probable` evidence.
#
# SCHEMA (per [[entry]]):
#   match_type       "vid_pid" | "vid_pid_wildcard" (pid="*", vendor-only signal,
#                     real discriminator is the ADB/fastboot interface class) |
#                     "usb_class" (vendor-independent; class_code carries the
#                     bInterfaceClass:bInterfaceSubClass:bInterfaceProtocol hex triplet
#                     instead of vid/pid)
#   vid, pid         lowercase hex strings, 4 digits each; "" when match_type="usb_class"
#   class_code       "cc:ss:pp" hex triplet; "" unless match_type="usb_class"
#   vendor           silicon/OEM vendor name
#   soc_family       SoC/chip family this pair identifies (comma-separated when one
#                     PID is shared across a generation — MediaTek and Allwinner in
#                     particular do not vary PID per SoC model)
#   mode_name        human name of the boot/recovery mode
#   recommended_tool the tool this repo's TOOL_REGISTRY/limpet plugins should dispatch to
#   confidence       0.0-1.0, see above
#   notes            caveats, protocol notes, disambiguation from a similar pair

schema_version = 1

