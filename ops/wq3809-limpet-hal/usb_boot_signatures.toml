# ---------------------------------------------------------------------------
# 7. Broadcom — USB boot ROM (VID 0a5c, "Broadcom Corp")
# ---------------------------------------------------------------------------
# Research finding: Broadcom does not expose a flashing/recovery USB mode analogous
# to MediaTek/Qualcomm/Rockchip on its mobile/WWAN SoC lines (those are generally
# locked-down and accessed, if at all, via the carrier/OEM's own signed tooling, not
# a public USB BootROM protocol). The one genuinely RE-relevant, well-documented
# Broadcom USB boot surface is the Raspberry Pi's BCM283x/BCM2711 "USB Boot" ROM mode
# (used by `rpiboot` / `usbboot` for diskless/EEPROM-less boot and recovery), and
# router firmware on Broadcom-SoC boxes is near-universally flashed over
# UART/JTAG/TFTP rather than USB, so it is out of scope for a VID:PID table.

