# wq#1594 — systemd drop-in for lumen-dgm.service.
#
# Deploy (outside this repo's git history — lumen-dgm.service lives on the
# gateway/agent5 host at /etc/systemd/system/lumen-dgm.service, not in this
# worktree; see ops/wq1594-ops-emergency-recurring-job/README.md for why):
#
#   mkdir -p /etc/systemd/system/lumen-dgm.service.d
#   cp agent5-dgm-key.conf /etc/systemd/system/lumen-dgm.service.d/override.conf
#   systemctl daemon-reload
#   # next scheduled 17:00:00 UTC fire (or a manual `systemctl start
#   # lumen-dgm.service` test run) picks up the new EnvironmentFile — no
#   # restart of a running instance needed, this unit is a oneshot.
#
# Effect: the base unit's EnvironmentFile=/home/lumen/agent/.env resolves
# LITELLM_MASTER_KEY to the shared ops-emergency virtual key. The empty
# EnvironmentFile= line below clears that inherited entry (systemd drop-in
# semantics for list-type directives), then loads the agent5-dgm key that
# wq#1022 already minted for this exact caller
# (/home/lumen/.secrets/litellm-service-keys/env/agent5-dgm.env) but never
# wired into the scheduled unit -- see README.md "Identification" step 4 for
# why wq#1022's a5_common.py env-first fix didn't cover this path.
#
# DGM_JUDGE_MODEL is speculative (see README.md fix step 2): only takes
# effect if benchmark_v2.py's grade_answer()/generate_answer() actually reads
# a model-override env var. If it doesn't, the live-access session should
# instead change the deepseek-v4-pro literal in that function to
# glm-5.3-flash directly and drop this line.

[Service]
EnvironmentFile=
EnvironmentFile=/home/lumen/.secrets/litellm-service-keys/env/agent5-dgm.env
Environment=DGM_JUDGE_MODEL=glm-5.3-flash
