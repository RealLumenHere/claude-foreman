# /etc/mbpfan.conf for MacPro6,1 (wq#2508). Values from 'Fleet up to 11.md' L98-103.
# max_fan1_speed stays 1900 on purpose: the SMC reports fan1_max=1947
# (research/ISIS_POWEROFF_RCA.md:100), so this leaves 47 rpm of margin under it.
# mbpfan reads coretemp only; it cannot see the GPU dies (research/MBPFAN_MACPRO61.md §4).

[general]
min_fan1_speed = 1100
max_fan1_speed = 1900
low_temp = 50
high_temp = 70
max_temp = 80
polling_interval = 1
