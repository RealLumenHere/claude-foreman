[Service]
# wq#3650: cap ollama to the E5-2697 v2's 12 PHYSICAL cores, not its 24 hyperthreads
# (research/inference_nodes.yaml nodes.isis/hathor.cores: 12). Letting the scheduler spread
# across both threads of every core does not add throughput on this CPU-bound inference box; it
# adds contention with mbpfan/gpu-lowpower's own threads and the SMC-floor fan noise this ticket
# is also trying to keep down.
Environment=OLLAMA_NUM_THREADS=12
