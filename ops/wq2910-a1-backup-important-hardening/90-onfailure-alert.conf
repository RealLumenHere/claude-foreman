# Install as:
#   /etc/systemd/system/lumen-backup-important.service.d/90-onfailure-alert.conf
# wq#2910: the unit already fails visibly (exit 2, 2026-09-27) but nothing
# opened an aq row for it -- a failed important backup was only a red unit
# nobody lists. Reuses the ntfy-onfailure@%n.service template already wired
# on 7 other units in this repo (grep OnFailure ops/*/*.service):
# systemd-onfailure-ntfy:33 already runs
#   /home/lumen/bin/aq add systemd "svc-fail-$U" "$U failed (result=$RES)" "$MSG"
# on any unit it is attached to, so this is a one-line drop-in, not a
# reimplementation.
[Unit]
OnFailure=ntfy-onfailure@%n.service
