# /etc/systemd/system/minerva-proposal.service.d/zz-wq1528-judge-window.conf
# wq#1528 (2026-09-13): judge window sized so retrieved facts survive the digest
# (PROMOTER_JUDGE_REPAIR_DESIGN.md §2c/§2e; wq#1383 window class, 3rd occurrence).
#
# Ordering that must hold (minerva_verify asserts it at import):
#   compact judge digest (17535 chars on 2026-09-13) + CLOSED_WORLD (693)
#   + FACTPACK_FACTS_RESERVE (4000) <= FACTPACK_CAP (22500)
#   <= VERIFY_JUDGE_CTX_CHARS (23000) <= rung window (~23500 chars).
#
# Rung bound: qwen36-local = llama-server on Isis, n_ctx 8192 TOKENS shared by
# prompt + completion. Measured 2026-09-08 10:45 run: 20000-char context ->
# 6144-token prompt. 8192 - 600 completion (VERIFY_JUDGE_MAX_TOKENS) - 256
# safety = 7336 prompt tokens; the 1192-token delta over 6144 allows ~3576 more
# context chars at a conservative 3.0 chars/token, so 23000 fits with margin.
#
# This file is named zz- so it sorts AFTER factpack.conf (2026-07-27), which
# still sets the legacy name JUDGE_CTX_CHARS=16000. The code reads
# VERIFY_JUDGE_CTX_CHARS (never set anywhere before this file); the legacy name
# is overridden here too so tooling that reads it (ops/wq1501 verify_judge.py
# window check) sees the effective value.
#
# Rollback: sudo rm this file + daemon-reload -> code defaults apply
# (FACTPACK_CAP 22500 / VERIFY_JUDGE_CTX_CHARS 23000 after this ticket's
# minerva patch; the stale factpack.conf JUDGE_CTX_CHARS=16000 resurfaces but
# is read by no code path).
[Service]
Environment=VERIFY_JUDGE_CTX_CHARS=23000
Environment=JUDGE_CTX_CHARS=23000
Environment=FACTPACK_CAP=22500
Environment=FACTPACK_FACTS_RESERVE=4000
