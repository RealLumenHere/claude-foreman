# wq#1295 — merge into the live LiteLLM proxy config.yaml (not committed to
# this repo; lives on the gateway node at /home/lumen/agent/litellm_config.yaml,
# outside git — same convention as wq#897/wq#948/wq#1299/wq#1406/wq#1590).
# This BUILD worker's sandbox has no access to that host, so this is a
# fragment to hand-merge, not a diff. Run backup_and_verify.sh BEFORE and
# AFTER merging (see README.md).
#
# VERIFY on first deploy: the exact key for scoping background_health_checks
# to a model subset (`health_check_models` below is the name documented as
# of training cutoff; some LiteLLM versions instead gate per-deployment via
# `model_info.health_check_enabled: false`) — confirm against
# `litellm --version` and adjust. Use `health_check_model_filter.py` against
# the live model_list to compute the capped roster either way.

general_settings:
  # Day-0 item: kb/tooling-findings-review.md §5 + kb/fleet-upgrade-plan-review.md §4.3.
  background_health_checks: true
  health_check_interval: 300   # 5min — generous; /health/readiness (below) covers fast liveness
  health_check_details: false  # smaller poll payload, status only

  # Capped roster — EXCLUDES expensive (opus-class) and local/ollama rungs.
  # See health_check_model_filter.py for the exclusion rule and
  # render_capped_list() to regenerate this list against the live
  # model_list. Placeholder names below; replace with the real capped
  # roster's model_name values on deploy.
  health_check_models:
    - PLACEHOLDER_RUN_health_check_model_filter_py_AGAINST_LIVE_CONFIG

litellm_settings:
  # Registers health_check_failure_alert.py's callback ALONGSIDE whatever is
  # already listed here (e.g. wq#1299's phoenix_logger, wq#1406's
  # paid_fallback_logger) — failure_callback is a list, append, don't
  # replace.
  failure_callback: [..., "health_check_failure_alert.health_check_alert_logger"]

environment_variables:
  HEALTH_CHECK_ALERT_TOPIC: "lumen-alerts"
  HEALTH_CHECK_ALERT_COOLDOWN_MIN: "30"  # edge-triggered: alert once per breach, re-alert every 30min while it persists

# --- Gatus wiring (separate host/config, see gatus_config.diff) ---
# Point Gatus at GET /health/readiness (cheap liveness, no per-model calls,
# safe for a 1m interval) rather than GET /health (calls every configured
# model — kb/fleet-upgrade-plan-review.md §4.3: "slow enough on a large
# model list to trip Gatus's own timeout and produce false alarms"). /health
# itself stays polled by LiteLLM's own background_health_checks above, with
# failures reaching ntfy via failure_callback — Gatus does not need to also
# hit the expensive endpoint.
