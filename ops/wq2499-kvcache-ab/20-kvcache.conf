# wq#2499: q8_0 KV cache on ollama. V-cache quantization needs flash attention or
# llama.cpp silently falls back to f16, so FLASH_ATTENTION is set explicitly.
# Install as /etc/systemd/system/ollama.service.d/20-kvcache.conf (sorts after override.conf).
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
