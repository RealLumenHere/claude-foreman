[Service]
# wq#3299: stock supergateway never reaps per-request DC handlers on Bes (no
# PR#151 narrowed reap — that patch only shipped to Lumen, 2026-07-06). 157
# idle handlers hit 13.1GB with no cap, global OOM 2026-09-30 21:20 PDT took
# HA python + systemd user mgr + vmagent-nodeexp with it. These caps turn an
# unbounded leak into a bounded, restartable one instead of a box-wide OOM.
MemoryHigh=6G
MemoryMax=8G
TasksMax=512
