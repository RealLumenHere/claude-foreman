# wq#3299: Bes ran stock supergateway with no per-request reap (PR#108 upstream,
# deployed to Lumen 2026-07-06 only) — 157 idle DC handlers, 13.1GB cgroup, no
# MemoryMax, caused global OOM 2026-09-30 21:20 PDT (killed HA python, systemd
# user mgr, vmagent-nodeexp; ~5h Commander failover outage).
#
# MemoryHigh throttles (cgroup memory.high -> reclaim pressure) before MemoryMax
# hard-kills (OOM via cgroup memory.max) the unit, so a leak degrades instead of
# taking the whole box down with it a second time. TasksMax caps the per-request
# child-process fork bomb case (#108's own failure mode if reap ever regresses).
[Service]
MemoryHigh=6G
MemoryMax=8G
TasksMax=512
