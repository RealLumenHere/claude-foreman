# wq#2153 / P2 — install to /etc/systemd/logind.conf.d/90-ignore-power-key.conf on isis.
#
# A hot-plugged HP USB Multimedia Keyboard (0461:4e67) fired "Power key pressed
# short" 10 s after enumeration and cleanly took isis down at 2026-09-20 01:04:07
# (research/ISIS_POWEROFF_RCA.md §2). isis ships the stock default
# HandlePowerKey=poweroff (/etc/systemd/logind.conf:28), so any button-capable HID
# that enumerates can power the node off.
#
# TRADEOFF, ACCEPTED EXPLICITLY: a real power-button press no longer takes isis
# down. That is fine on a node power-cycled via plug p1.
#
# HandlePowerKeyLongPress is NOT set here: isis's shipped default is already
# `ignore` (/etc/systemd/logind.conf:29), and a long press is not the observed
# failure mode.
#
# Reverse by deleting this file and `systemctl restart systemd-logind`.

[Login]
HandlePowerKey=ignore
