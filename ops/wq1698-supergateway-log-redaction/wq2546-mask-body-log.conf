# Install as: /etc/systemd/system/desktop-commander-mcp.service.d/wq2546-mask-body-log.conf
# then: systemctl daemon-reload && systemctl restart desktop-commander-mcp
# (NOT applied by this ticket — see apply-mask.sh and the wq#2546 section of
# README.md in this directory for why.)
#
# wq#2546: no-body-logs-journald.conf (wq#1698, this directory) stopped the
# supergateway body/chatter stream from reaching journald/Bes by appending it
# RAW to /home/lumen/logs/supergateway/desktop-commander-mcp.log instead — but
# "raw" is exactly what wq#2514's consumer scan caught: the live RealLumenHere
# PAT (fp 27ec5cf7418a) sitting unmasked in that 64MB file. Moving the stream
# off Bes never masked it; this drop-in does.
#
# systemd's `StandardOutput=append:<path>` (set by no-body-logs-journald.conf)
# is a raw fd redirect — it cannot pipe through a filter — so the filtering has
# to happen inside ExecStart itself. This drop-in REPLACES that StandardOutput
# setting (back to journal, now unused — see below) and instead:
#   1. clears the unit's ExecStart (the empty `ExecStart=` line — required
#      before Type=simple/exec accepts a second, replacing entry) and
#      re-specifies the exact command line currently in effect per
#      session-timeout.conf (wq#380) so this drop-in stays a pure masking
#      change, not a behavior change to the gateway's flags or ports;
#   2. wraps it in `exec /bin/bash -c '... > >(mask-secrets >> LOGFILE)'` so
#      `exec` hands the shell's PID straight to supergateway (systemd's
#      Restart=always/KillMode=control-group keep tracking the real process,
#      not an orphaned bash), and only stdout (the body/chatter stream) is
#      routed through /home/lumen/bin/mask-secrets — the same PATTERNS table
#      harness/masking.py uses, kept in lockstep per that script's own header
#      — before landing in the log file;
#   3. leaves stderr on its own fd, still governed by
#      no-body-logs-journald.conf's `StandardError=journal`, so error-level
#      diagnostics (`Child exited: code=…`, transport errors) are unaffected
#      and keep going to the small journald stream, same as wq#1698 intended.
#
# Filename is prefixed `wq2546-` specifically so it sorts (systemd applies
# .service.d drop-ins in filename order) AFTER session-timeout.conf — if a
# future drop-in needs to win the ExecStart= override again, name it to sort
# later still, or this masking pass silently stops applying.
#
# size rotation is unaffected: supergateway-logrotate.conf (this directory,
# wq#1698) already caps the file at 50M x 4, copytruncate, and continues to
# apply regardless of what writes into it.
[Service]
StandardOutput=journal
ExecStart=
ExecStart=/bin/bash -c 'exec /home/lumen/.npm-global/bin/supergateway --stdio "/home/lumen/.npm-global/bin/desktop-commander" --port 3100 --outputTransport streamableHttp --streamableHttpPath /mcp --cors --healthEndpoint /health > >(exec /home/lumen/bin/mask-secrets >> /home/lumen/logs/supergateway/desktop-commander-mcp.log)'
