# Install as: /etc/logrotate.d/supergateway-desktop-commander
# wq#1698: cap the local body-log file created by no-body-logs-journald.conf so
# it cannot become an unbounded-disk problem the way the journal did.
/home/lumen/logs/supergateway/desktop-commander-mcp.log {
    size 50M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0600 lumen lumen
}
