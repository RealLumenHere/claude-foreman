# Install as: /etc/systemd/system/desktop-commander-mcp.service.d/no-body-logs-journald.conf
# then: systemctl daemon-reload && systemctl restart desktop-commander-mcp
#
# wq#1698: supergateway (v3.4.3, dist/gateways/stdioToStatelessStreamableHttp.js)
# logs every MCP request/response body at --logLevel info (the unit's default —
# see desktop-commander-mcp.service ExecStart, no --logLevel flag set), e.g.
# "Child → StreamableHttp: <full Commander stdout>" and "StreamableHttp →
# Child: <full command JSON>" (dist/gateways/stdioToStatelessStreamableHttp.js:194,207,235,244,253).
# journald captures stdout+stderr from the unit by default, so every body line
# lands in the journal and is shipped to VictoriaLogs on Bes by vlogs-forwarder
# (90d retention) — a second, longer-lived copy of anything a Commander session
# printed, secrets included. At ~774k lines/day the unit alone also exhausts
# journald's SystemMaxUse=1G in ~11h, so ordinary operational history (not just
# secrets) is gone within a day.
#
# --logLevel none (supergateway's only other choice) was rejected: it silences
# logger.error too (dist/lib/getLogger.js:5-8 noneLogger), which drops
# "Child exited: code=…" (line 160) and transport-error diagnostics along with
# the body dumps — worse for incident response, not better. Splitting
# stdout/stderr at the systemd level keeps that error signal in journald (small
# volume, no bodies) while moving the high-volume, secret-bearing body/chatter
# stream to a local, permission-restricted, size-capped file that never reaches
# journald or vlogs-forwarder.
#
# The log file must exist with mode 0600 owner lumen:lumen BEFORE this drop-in
# takes effect (systemd's `append:` target does not create-with-mode; see
# apply.sh). logrotate.conf caps it at 50M x 4 rotations, compressed.
[Service]
StandardOutput=append:/home/lumen/logs/supergateway/desktop-commander-mcp.log
StandardError=journal
