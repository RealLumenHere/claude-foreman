# Install as: /etc/systemd/system/desktop-commander-mcp.service.d/10-control-plane-priority.conf
# then: systemctl daemon-reload && systemd-run --collect --unit=wq2605-restart-commander systemctl restart desktop-commander-mcp
#
# wq#2605 / MCP_CONTROL_PLANE_HA_DESIGN.md §3.3: worker storms starve the control
# plane (2026-09-25 04:28Z load 104/44 cores, every :3100 request "context
# canceled", DC 16G swap peak). CPUWeight/IOWeight give this unit priority over
# lumen-workers.slice (weight 50) under cgroup contention; Nice/OOMScoreAdjust
# bias the scheduler and the OOM killer the same direction; MemorySwapMax stops
# a leak from paging 16G to disk again (verified live: base unit already carries
# MemoryHigh=20G/MemoryMax=26G via `systemctl cat`, NOT the 8G the ticket assumed
# — left untouched here, see ops/wq2605-control-plane-isolation/README.md).
#
# NOTE: CPUWeight=1000/IOWeight=1000 are already live on this unit today via
# `systemctl set-property --runtime` (visible as /run/systemd/system.control/
# 50-CPUWeight.conf / 50-IOWeight.conf in `systemctl cat`) — an ad-hoc response
# to the 04:28Z incident that does NOT survive a reboot or `daemon-reload`
# clearing /run. This drop-in makes the same values persistent and adds the
# three properties that were never applied at all (Nice, OOMScoreAdjust,
# MemorySwapMax).
[Service]
CPUWeight=1000
IOWeight=1000
Nice=-5
OOMScoreAdjust=-900
MemorySwapMax=1G
