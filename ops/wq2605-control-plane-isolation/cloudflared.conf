# Install as: /etc/systemd/system/cloudflared.service.d/10-control-plane-priority.conf
# then: systemctl daemon-reload && systemd-run --collect --unit=wq2605-restart-cloudflared systemctl restart cloudflared
#
# wq#2605 / MCP_CONTROL_PLANE_HA_DESIGN.md §3.3: cloudflared is on the same
# request path as desktop-commander-mcp (Commander MCP rides this tunnel), so it
# gets the same CPU/IO priority. No MemorySwapMax here — that property is DC-only
# per the ticket (cloudflared did not show the 16G swap symptom).
#
# NOTE: CPUWeight=1000/IOWeight=1000 are already live on this unit today via
# `systemctl set-property --runtime` (visible in `systemctl cat cloudflared`) —
# ad-hoc, does not survive reboot/daemon-reload. This drop-in makes it
# persistent and adds Nice/OOMScoreAdjust, which were never applied.
[Service]
CPUWeight=1000
IOWeight=1000
Nice=-5
OOMScoreAdjust=-900
