# wq#3849: M80s (i7-12700, 8 P-cores + 4 E-cores / 20 threads) Ollama tuning.
# Install as /etc/systemd/system/ollama.service.d/10-pcore-pin.conf, then
# `systemctl daemon-reload && systemctl restart ollama`.
#
# CPUAffinity pins ollama.service (and everything it forks: runners, llama.cpp)
# to the 16 logical CPUs backing the 8 P-cores (cpus 0-15 under the BIOS's
# default P-core-first logical numbering — verify with `lscpu -e` on the box
# before trusting this range; Alder Lake hybrid numbering is not guaranteed
# identical across BIOS/microcode revisions). E-cores (16-19) stay free for
# Docker/builds/background services per the hardware doc's P-core strategy.
[Service]
CPUAffinity=0-15
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_FLASH_ATTENTION=1"
