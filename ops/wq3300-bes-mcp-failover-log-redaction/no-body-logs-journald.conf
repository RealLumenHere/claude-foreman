# Install as: /etc/systemd/system/bes-mcp-failover.service.d/no-body-logs-journald.conf
# then: systemctl daemon-reload && systemctl restart bes-mcp-failover
#
# wq#3300 — port of wq#1698 (Lumen's desktop-commander-mcp.service) to Bes.
# bes-mcp-failover.service runs the same supergateway+desktop-commander
# gateway shape on :3100/mcp (lumen_state bes.mcp_failover) with no
# --logLevel flag, so it defaults to `info` and logs every MCP
# request/response body verbatim to stdout — see wq#1698's
# no-body-logs-journald.conf (ops/wq1698-supergateway-log-redaction/) for the
# supergateway source lines; same binary, same behavior. journald captures
# stdout+stderr from the unit by default, and Bes has NO drop-in splitting
# that stream, so every body line (measured 3137 body lines/24h) lands in
# the local journal AND — confirmed by grep — a fleet sudo password literal
# appears 9x/24h in the body stream. Journal was 3.9G at measurement time.
#
# Same fix as wq#1698: split stdout/stderr at the systemd level instead of
# `--logLevel none` (which would also silence logger.error, losing
# "Child exited: code=…" and transport-error diagnostics).
#
# The log file must exist with mode 0600 owner bes:bes BEFORE this drop-in
# takes effect (systemd's `append:` target does not create-with-mode; see
# apply.sh). bes-mcp-failover-logrotate.conf caps it at 50M x 4 rotations,
# compressed.
[Service]
StandardOutput=append:/home/bes/logs/supergateway/bes-mcp-failover.log
StandardError=journal
