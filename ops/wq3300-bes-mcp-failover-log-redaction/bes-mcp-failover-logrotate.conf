# Install as: /etc/logrotate.d/bes-mcp-failover
# wq#3300 port of wq#1698/wq#2606's supergateway logrotate.conf for Bes's
# bes-mcp-failover.service (home dir /home/bes, not /home/lumen).
/home/bes/logs/supergateway/*.log {
    size 50M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0600 bes bes
}
