# wq#2751: the unit said 127.0.0.1:3104 but supergateway bound *:3104, so create/delete_entities was
# open to the tailnet with no auth. Bind 127.0.0.1; memory-mcp.lumennode.uk reaches it through
# cloudflared at localhost:3104. Exit 78 = bad port env.
[Service]
Environment=NODE_OPTIONS=--require=/home/lumen/bin/loopback-listen.cjs
Environment=LOOPBACK_LISTEN_PORT=3104
RestartPreventExitStatus=78
