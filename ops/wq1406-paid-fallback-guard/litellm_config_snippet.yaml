# wq#1406 — merge into the live LiteLLM proxy config.yaml (not committed to
# this repo; lives on the gateway node at /home/lumen/agent/litellm_config.yaml,
# outside git — same convention as wq#897/wq#948/wq#1299). This BUILD worker's
# sandbox has no read access to that file (confirmed: /home/lumen/agent is not
# in the allowed-dirs set), so this is a fragment to hand-merge, not a diff.
#
# VERIFY on first deploy: exact `success_callback` key name and the
# `module.instance_name` loading syntax against the LiteLLM version actually
# running (litellm --version) — same caveat wq#1299 flagged for its callback.

litellm_settings:
  # Registers paid_fallback_alert.py's callback ALONGSIDE whatever is already
  # listed here (e.g. wq#1299's phoenix_logger) — success_callback is a list,
  # append, don't replace.
  success_callback: [..., "paid_fallback_alert.paid_fallback_logger"]

environment_variables:
  PAID_FALLBACK_TOPIC: "lumen-alerts"
  PAID_FALLBACK_COOLDOWN_MIN: "30"  # edge-triggered: alert once per breach, re-alert every 30min while it persists — wq#911's contract

# --- router_settings.fallbacks audit ---
# Run ops/wq1406-paid-fallback-guard/audit_fallback_chains.py against this
# file's live copy before merging further changes to `fallbacks:` below.
# Any chain where a PAID group (deepseek/openrouter/mistral/anthropic/openai/
# cerebras) is reachable before a FREE/local one is a violation to fix by
# reordering (free first) or adding a missing free/local rung — not by
# deleting the paid rung outright, since a terminal paid rung that never
# fires except on total local outage is an acceptable last resort (see
# wq#907: terminal rungs are deliberately on cloud providers so a chain
# doesn't dead-end). What is NOT acceptable is paid-before-free ordering,
# which is what silently drained $23/day undetected.
