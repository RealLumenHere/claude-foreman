# fleet-selfheal config (wq#3354). Read by selfheal_sweep.py and leakwatch.py.
# Every class has `enabled: true|false`; flipping one off is the per-class rollback.

ticket_lane: build      # the lane the orchestrator dispatches fworkers from
ticket_pri: p1

guards:                 # CLASS 1
  enabled: true
  max_attempts: 3                 # consecutive sweeps that try `systemctl start`
  service_failed_after_s: 1800    # guard service failed this long -> ticket
  timers:                         # named: a missing one is itself a ticket
    - lumen-pat-scan.timer
    - lumen-mask-at-rest.timer
    - repo-visibility-sentinel.timer
    - lumen-sentinel-watch.timer
    - wq-drift-guard.timer
    - lumen-iptables-drift-guard.timer
    - unit-drift.timer
    - lumen-cli-drift.timer
    - storage-manifest-drift.timer
    - ops-deploy-drift.timer
    - drift-assert.timer
    - lumen-ui-drift.timer
    - primary-tree-guard.timer
    - dc-config-guard.timer
    - lumen-failed-units.timer
    - lumen-disk-pct-alarm.timer
    - litellm-completion-probe.timer
    - lumen-exposure-census.timer
  patterns: ["*guard*.timer", "*sentinel*.timer", "*drift*.timer", "*pat-scan*.timer",
             "*mask-at-rest*.timer", "*watchdog*.timer"]
  exclude: []

crashloop:              # CLASS 2
  enabled: true
  window_s: 300
  max_restarts: 3                 # MORE than this many in window_s = crash-loop
  hold_hours: 12                  # holddown restore_by; self-healer restores after
  never_stop:                     # alert + ticket only: Frank's access paths, healers
    - cloudflared*.service
    - "*vault*.service"
    - "*commander*.service"
    - mcp-gateway.service
    - mcpw-keepalive.service
    - "*supergateway*.service"
    - tailscaled.service
    - ssh.service
    - sshd.service
    - docker.service
    - containerd.service
    - systemd-*.service
    - dbus*.service
    - NetworkManager*.service
    - lumen-self-healer.service
  ignore:
    - lumen-fleet-selfheal.service

disk:                   # CLASS 4
  enabled: true
  threshold_pct: 90
  cooldown_s: 3600                # at most one prune pass an hour
  mounts: ["/", "/home", "/data/lumen"]
  pruners: [npm_cache, pip_cache, cargo_registry_cache, journal, stale_worktrees]

providers:              # CLASS 5
  enabled: true
  full_interval_s: 1800           # probe every host (one tiny completion each)
  recheck_interval_s: 300         # re-probe only hosts already failing auth
  disable_after_s: 600
  cooldown_s: 21600               # refreshed every recheck while still failing
  quota_cooldown_s: 1800          # fallback when the provider gives no retryDelay (wq#4807)
  quota_ticket_after_per_day: 3   # recurring quota hits this often/day -> capacity ticket
  rate_limited_cooldown_s: 30     # generic 429, no quota body: short backoff, never a ticket
  litellm_config: /home/lumen/agent/litellm_config.yaml
  env_path: /home/lumen/.secrets/litellm-service-keys/env/sentinel.env   # master key is retired on LLM routes (wq#914); probe with the sentinel virtual key (same LITELLM_MASTER_KEY var name)
  gateway_url: http://localhost:4000/v1/chat/completions
  cooldown_path: /home/lumen/foreman/dispatcher/runtime/backend_cooldown.json

nodes:                  # CLASS 6
  enabled: true
  offline_after_s: 1800
  ignore:                          # lumen_state node names meant to be off
    - thor                        # wq#3506: Frank's active laptop (TLP/ASPM/s2idle,
                                   # 85% charge cap) — sleeps/roams off tailnet by
                                   # design, not a fleet outage; never remote-managed
                                   # per CLAUDE.md Tier-0 #2 either way
    - maksoor               # wq#3524: RE workstation (laptop), Frank power-cycles
                             # it by hand; lumen_state history shows prior
                             # ONLINE/OFFLINE toggles (09-30 -> 10-01) with no
                             # incident, not an always-on fleet node
    - apis        # wq#3450: DEAD hardware, confirmed 2026-08-13, e-waste; physical decision tracked in wq#550
    - pbox         # wq#3450: DECOMMISSIONED 2026-08-28 (Frank), removed from fleet
    - seshat       # wq#3450: P6 powered off by Frank 2026-09-30 pending inspection; do not power on
    - be3600       # wq#3450: tailscale subnet/exit-node role broken since 2026-06-17; router itself works via LAN
    - 3dprinter    # wq#3450: AIO powered off, no lan_ip/ssh path recorded; not fleet-managed
    - neith        # wq#4773: lumen_state neith.lifecycle/role flipped to RETIRED on
                   # 2026-10-27 (Frank stated) -- "Commander standby role superseded by
                   # cloud. Not a failover target. Do not patch, do not promote." This
                   # supersedes the wq#4062 SERVING/failover note previously carried in
                   # nodes.notes (2026-10-07, [conf 0.12], already [UNVERIFIABLE -- no
                   # probe], now removed): neith is no longer in the mcpw backend pool,
                   # so a tailscale outage here has no ops impact. Frank off-decision,
                   # same class as apis/pbox/seshat/be3600.
    - khnum        # RETIRED 2026-10-27 (Frank, orch-12). Commander standby role superseded by cloud. lifecycle=retired in state.
    - wadjet       # wq#4814: RETIRED -- Mac Pro 6,1, Frank "all Macs retired", and
                   # wadjet is on ORCHESTRATOR-HANDOFF.md section 3's actual retired
                   # list (isis/hathor/wadjet/nephthys/seshat -- see khepri note below
                   # for that citation). Unlike khepri, which the same brief wrongly
                   # swept in while it was still serving live inference, wadjet's
                   # LiteLLM rungs (wadjet-coder-14b, wadjet-embed) were actually
                   # removed from litellm_config.yaml -- a verified fact, not
                   # UNVERIFIABLE like its power_plug (P12 dropped from monitoring
                   # 2026-07-16). It was still online+serving Ollama as of 2026-10-26
                   # with no work routed to it, and is now dark on tailscale (LastSeen
                   # 2026-11-03T00:10:00.1Z) -- consistent with the retirement
                   # completing, not an unexplained outage. No self-idle timer like
                   # hathor's on record, so ignore (permanent), not sleepers.
  sleepers:                        # wq#3702: nodes that power THEMSELVES off when idle.
    - hathor                       # Dark-while-off is by design and files nothing; dark
                                   # while answering on lan_ip is the tailscaled boot race
                                   # and still pages. hathor: Frank power_policy
                                   # 2026-09-18 "SHUT DOWN AFTER WORK" + auto-sleep.timer
                                   # (lumen_state hathor.auto_sleep, since 2026-10-08)
                                   # poweroffs after 30min idle; wq#3696 put it in
                                   # nodes.ignore for that nap, which also silenced the
                                   # unfixed cold-boot tailscaled failure on the same
                                   # signal (wq#3697 verify: reports/
                                   # wq3697_verify_wq3696_hathor_ignore_blindspot.md).
                                   # Wake path: wake-dispatch.sh wake hathor.
  sleeper_tailnet_grace_s: 300      # awake on LAN but dark this long = boot race, not boot
                                    # (hathor's wake is ~115s end to end)
  notes:                           # wq#3619: known-issue context folded into a node's
                                   # outage ticket, keyed by lumen_state node name —
                                   # NOT a silencer like ignore above, the page still fires
    hathor: "every hathor wake is a COLD BOOT (WoL tested and FAILED 2026-10-08; the working path is a plug p3 power-cycle, ~115s), and a cold boot can leave tailscaled 'network down' -- observed on hathor 2026-10-08, fixed by `sudo systemctl restart tailscaled`. wake-dispatch.sh:96-98 detects it but only LOGS a warning, it does not remediate (wq#3685). So: hathor dark on tailscale while powered off is its auto-sleep nap (nodes.sleepers suppresses it); hathor dark on tailscale while answering ping on 192.168.8.172 is that boot race -- restart tailscaled on hathor, and see wq#3702 for why this is notes+sleepers and not nodes.ignore."
    isis: "wq#4448 (2026-10-20): isis hard-off since 2026-10-19 ~21:28-21:30Z -- went dark
       within a minute of khepri (nephthys lost power the same evening), recovery tracked as
       wq#4420 [frank_gated PHYSICAL]. Remote power recovery does NOT work for isis even
       though plug p1 is remotely controllable: wq#4420 plug-cycled p1 at ~22:23Z, relay ON
       restored but the Mac Pro 6,1 does NOT boot after AC loss -- it needs the physical
       power button (same cold-boot-only class as hathor above, but isis has no WoL path
       recorded either). At the wq#4448 sweep, plug p1 (192.168.8.118) itself also stopped
       answering kasa discovery (10s timeout; confirmed 2026-10-20 from lumen: TCP:80
       connect to .118 fails while gateway .8.1 and plug p11 .115 answer), so even the
       plug-state read can be dark during this outage. isis is the Frank-policy WARM
       STANDBY local LLM (power_policy 2026-09-18, qwen3.6:35b-a3b = LiteLLM lumen/code +
       qwen36-local): never nodes.ignore/sleepers -- a dark isis is always a real page.
       This note carries the no-auto-boot + wq#4420 context so the next page doesn't
       re-derive it or burn another futile plug-cycle; once Frank presses the button,
       wq#4289 (aider e2e) unblocks."
