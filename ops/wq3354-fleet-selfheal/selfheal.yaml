       ARP reply) while gateway 192.168.8.1:80 answers, so the router is unpowered,
       unplugged or off the LAN -- not a tailscaled-only fault like be3600's. No smart plug
       and no fleet-exec grant (DENY grant:grant_missing_env), so nothing remote can fix it.
       Still not ignore/sleepers: no fact says it is meant to be off and it has no idle
       timer. The physical check (is it powered, and does Frank power it down between RE
       sessions?) is queued as wq#4776 [frank-hw]. If Frank says it is a bench device he
