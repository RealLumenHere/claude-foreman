# fleet-selfheal config (wq#3354). Read by selfheal_sweep.py and leakwatch.py.
# Every class has `enabled: true|false`; flipping one off is the per-class rollback.

ticket_lane: build      # the lane the orchestrator dispatches fworkers from
ticket_pri: p1

guards:                 # CLASS 1
  enabled: true
  max_attempts: 3                 # consecutive sweeps that try `systemctl start`
  service_failed_after_s: 1800    # guard service failed this long -> ticket
  timers:                         # named: a missing one is itself a ticket
    - lumen-pat-scan.timer
    - lumen-mask-at-rest.timer
    - repo-visibility-sentinel.timer
    - lumen-sentinel-watch.timer
    - wq-drift-guard.timer
    - lumen-iptables-drift-guard.timer
    - unit-drift.timer
    - lumen-cli-drift.timer
    - storage-manifest-drift.timer
    - ops-deploy-drift.timer
    - drift-assert.timer
    - lumen-ui-drift.timer
    - primary-tree-guard.timer
    - dc-config-guard.timer
    - lumen-failed-units.timer
    - lumen-disk-pct-alarm.timer
    - litellm-completion-probe.timer
  patterns: ["*guard*.timer", "*sentinel*.timer", "*drift*.timer", "*pat-scan*.timer",
             "*mask-at-rest*.timer", "*watchdog*.timer"]
  exclude: []

crashloop:              # CLASS 2
  enabled: true
  window_s: 300
  max_restarts: 3                 # MORE than this many in window_s = crash-loop
  hold_hours: 12                  # holddown restore_by; self-healer restores after
  never_stop:                     # alert + ticket only: Frank's access paths, healers
    - cloudflared*.service
    - "*vault*.service"
    - "*commander*.service"
    - mcp-gateway.service
    - mcpw-keepalive.service
    - "*supergateway*.service"
    - tailscaled.service
    - ssh.service
    - sshd.service
    - docker.service
    - containerd.service
    - systemd-*.service
    - dbus*.service
    - NetworkManager*.service
    - lumen-self-healer.service
  ignore:
    - lumen-fleet-selfheal.service

disk:                   # CLASS 4
  enabled: true
  threshold_pct: 90
  cooldown_s: 3600                # at most one prune pass an hour
  mounts: ["/", "/home", "/data/lumen"]
  pruners: [npm_cache, pip_cache, cargo_registry_cache, journal, stale_worktrees]

providers:              # CLASS 5
  enabled: true
  full_interval_s: 1800           # probe every host (one tiny completion each)
  recheck_interval_s: 300         # re-probe only hosts already failing auth
  disable_after_s: 600
  cooldown_s: 21600               # refreshed every recheck while still failing
  litellm_config: /home/lumen/agent/litellm_config.yaml
  env_path: /home/lumen/agent/.env
  gateway_url: http://localhost:4000/v1/chat/completions
  cooldown_path: /home/lumen/foreman/dispatcher/runtime/backend_cooldown.json

nodes:                  # CLASS 6
  enabled: true
  offline_after_s: 1800
  ignore: []                      # lumen_state node names meant to be off

leakwatch:              # CLASS 3 (leakwatch.py daemon)
  harness_dir: /home/lumen/foreman/harness
  rules:
    - dir: /home/lumen
      globs: [claude_memory.md]
      action: scan
    - dir: /home/lumen/agent
      globs: [litellm_config.yaml]
      action: scan
    - dir: /home/lumen/agent
      globs: [.env, .env.*, "litellm_config.yaml.*"]
      action: chmod
    - dir: /home/lumen/minerva/context
      globs: ["claude_credentials.md*"]
      action: chmod
    - dir: /home/lumen/foreman
      globs: ["claude_credentials.md*", .env]
      action: chmod
