       long-running fact, just one unexplained 30min gap, so it does not meet either ignore's
       bar (meant to be off for good) or sleepers' bar (self-idle nap that must stay reachable
       when up). Leaving this as a live page, not nodes.ignore/sleepers: a second occurrence
       with no Frank RE-session explanation would be the evidence to revisit, same precedent
       be3600 and maksoor were classified under.
      wq#4775 (2026-10-28, LastSeen 16:00Z): SECOND occurrence -- it was back on the tailnet
       between the two pages (sh_nodes drops a node's outage state when it reappears, and
       LastSeen is today), so this is intermittent, not a permanent break. Dark on LAN too,
