       100.120.105.55:22 timeout, gateway 192.168.8.1:80 open. Same state as wq#4775, with
       the same missing remote path. wq#4776 [frank-hw] is still open and now carries the
       time-of-day pattern. Classification unchanged until it answers."
    sia: "wq#4437: offline on tailscale since 2026-10-20T02:20:00Z (30+ min). lumen_state's
       sia.status='HEALTHY' (docker containers up 12h+, Miniflux news pipeline + PG17) and
