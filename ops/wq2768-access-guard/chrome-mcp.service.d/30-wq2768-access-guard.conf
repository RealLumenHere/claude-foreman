# wq#2768: origin-side Cloudflare Access JWT check on :3103, on top of the wq#2751 loopback bind.
# AUD is the chrome-mcp.lumennode.uk Access app (public: returned as cf-access-aud on any 403).
# MODE starts at shadow; access-guard-flip moves it to enforce once a real tunnel request verified.
# Never set ACCESS_GUARD_ISS or ACCESS_GUARD_CERTS_URL here: those are test-only overrides.
[Service]
Environment="NODE_OPTIONS=--require=/home/lumen/bin/loopback-listen.cjs --require=/home/lumen/bin/access-jwt-guard.cjs"
Environment=ACCESS_GUARD_PORT=3103
Environment=ACCESS_GUARD_TEAM=lumenseyes
Environment=ACCESS_GUARD_AUD=b55d587789fad868cfd13420b120ab5e523a1c792d224a3c14e2345e0120e9b3
Environment=ACCESS_GUARD_MODE=shadow
