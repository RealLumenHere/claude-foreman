# wq#2768: origin-side Cloudflare Access JWT check on :3104. Enforce from the start: memory-mcp has
# no working traffic to shadow (child binary missing, wq#2767). AUD = memory-mcp.lumennode.uk app.
# Never set ACCESS_GUARD_ISS or ACCESS_GUARD_CERTS_URL here: those are test-only overrides.
[Service]
Environment="NODE_OPTIONS=--require=/home/lumen/bin/loopback-listen.cjs --require=/home/lumen/bin/access-jwt-guard.cjs"
Environment=ACCESS_GUARD_PORT=3104
Environment=ACCESS_GUARD_TEAM=lumenseyes
Environment=ACCESS_GUARD_AUD=1f7efb30c2d61d70545bc7cea24824e60450c0355f6a68a8f54e625e3dff816d
Environment=ACCESS_GUARD_MODE=enforce
