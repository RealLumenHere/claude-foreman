  - model_name: lumen/code
    litellm_params:
      model: ollama/qwen3.6:35b-a3b
      api_base: http://100.100.129.24:11434
      timeout: 960
      stream_timeout: 960
      num_retries: 0
    model_info: {mode: chat, description: "qwen3.6:35b-a3b on isis (ollama)"}
  - model_name: lumen/chat-exp
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://100.98.74.87:11434/
      api_key: none
      timeout: 2460
  - model_name: nephthys-qwen14b
    litellm_params:
      model: openai/qwen3:14b
      api_base: http://100.98.74.87:11434/v1
      api_key: none
      extra_body: {"reasoning": {"effort": "none"}}
      max_parallel_requests: 2
