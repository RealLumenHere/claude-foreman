# /etc/systemd/system/dc-gateway.service.d/dc-gateway-logging.conf (MAKSOOR)
#
# wq#4331 parity with Lumen's no-body-logs-journald.conf (wq#1698): supergateway
# logs every MCP request/response body at the unit's default --logLevel info.
# Route stdout to a local, permission-restricted, size-capped file instead of
# journald (secrets-at-rest — firmware dumps and device credentials captured
# during RE sessions may pass through these bodies). The log file must exist
# with mode 0600 owner maksoor:maksoor BEFORE this drop-in takes effect
# (systemd's `append:` target does not create-with-mode) — see README.md.
# Pair with a logrotate stanza: size=50M rotate=3.
[Service]
StandardOutput=append:/home/maksoor/logs/supergateway/dc-gateway.log
StandardError=journal
