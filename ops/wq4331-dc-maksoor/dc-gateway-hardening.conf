# /etc/systemd/system/dc-gateway.service.d/dc-gateway-hardening.conf (MAKSOOR)
#
# wq#4331, same T1 hardening shape as Anubis/Bes (MCP_CONTROL_PLANE_HA_DESIGN.md
# §3.3): CPUWeight/IOWeight keep the gateway from starving under contention,
# Nice/OOMScoreAdjust bias scheduler+OOM-killer the same direction, MemorySwapMax
# stops a leak from paging out to disk (Lumen's own incident: 16G swap peak,
# unbounded, before this was added there). Nice is less negative than Lumen's
# (-5) here on purpose: Maksoor is an interactive desktop Frank is sitting at
# during RE sessions, and this gateway must not out-prioritize his own GUI/tools.
[Service]
CPUWeight=400
IOWeight=400
MemorySwapMax=512M
Nice=0
OOMScoreAdjust=-500
