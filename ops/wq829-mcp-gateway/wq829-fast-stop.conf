# Install as: /etc/systemd/system/desktop-commander-mcp.service.d/wq829-fast-stop.conf
# then: systemctl daemon-reload && systemctl restart desktop-commander-mcp
#
# wq#829: the 2026-08-23 03:07 outage was the pressure-guard's own remedy. Its
# `systemctl restart` hung 2m06s in the stop phase because a restic backup
# (spawned through desktop-commander, never detached) sat in the unit cgroup
# ignoring SIGTERM until the final-sigterm timeout SIGKILLed it. Every chat saw
# "Commander is down" for the whole window.
#
# TimeoutStopSec=10 bounds any recycle to a ~15s blip (10s stop + RestartSec 5).
# Consequence: anything still in the cgroup at stop+10s is SIGKILLed. Long jobs
# must detach (setsid / systemd-run --user) — the in-gateway reap (#108) already
# spares detached processes, and detaching also moves them out of blast radius
# of unit restarts.
#
# SUPERGATEWAY_MAX_CONCURRENT_CHILDREN gates the per-request child spawn storm
# (the root cause of the PSI trips that fire the guard). 12 is provisional —
# replace with the measured ceiling from loadtest.sh before considering wq#829
# closed. Queue overflow is shed with 503 + Retry-After after 30s.
[Service]
TimeoutStopSec=10
Environment=SUPERGATEWAY_MAX_CONCURRENT_CHILDREN=12
Environment=SUPERGATEWAY_QUEUE_TIMEOUT_MS=30000
