model_list:
- model_name: lumen-lfm2-1b
  litellm_params:
    model: openai/lfm2-1b
- model_name: deepseek-v4-pro
  litellm_params:
    model: deepseek/deepseek-v4-pro
# qwen-local-small: two deployments, round-robin across the pipeline-fix pair.
- model_name: qwen-local-small
  litellm_params:
    model: openai/qwen2.5-coder:3b
    api_base: http://192.168.8.125:11434/v1
    api_key: none
    timeout: 60
    stream_timeout: 60
    num_retries: 0
    max_parallel_requests: 2
  model_info:
    mode: chat
    description: "qwen2.5-coder:3b on hathor judge box"
- model_name: qwen-local-small
  litellm_params:
    model: openai/qwen2.5-coder:3b
    api_base: http://192.168.8.135:11434/v1
    api_key: none
    timeout: 60
    stream_timeout: 60
    num_retries: 0
    max_parallel_requests: 2
  model_info:
    mode: chat
    description: "qwen2.5-coder:3b on ptah"
- model_name: lumen/judge
  litellm_params:
    model: ollama/hathor-judge
    api_base: http://100.80.71.13:11434/v1
    api_key: none
    timeout: 10
    stream_timeout: 10
    num_retries: 0
    max_parallel_requests: 2
  model_info:
    mode: chat
    description: "llama3.1:8b-q8 on hathor (ollama) -- central judge primary"
- model_name: lumen-local-judge
  litellm_params:
    model: openai/qwen2.5-coder:7b
    api_base: http://172.17.0.1:11434/v1
    api_key: none
    timeout: 60
    stream_timeout: 60
    num_retries: 0
    max_parallel_requests: 2
  model_info:
    mode: chat
    description: "qwen2.5-coder:7b on the local docker-gateway ollama -- judge fallback"
router_settings:
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
  routing_strategy: least-busy
  num_retries: 3
  retry_after: 2
  allowed_fails: 2
  model_group_alias:
    lumen/fast: lumen-lfm2-1b
    lumen/best: deepseek-v4-pro
  fallbacks:
  - lumen-lfm2-1b:
    - openrouter-free
  - lumen/judge:
    - lumen-local-judge
  enable_pre_call_checks: true
litellm_settings:
  request_timeout: 240
  drop_params: true
  set_verbose: false
