# Deploy as /etc/systemd/system/primary-tree-guard.service.d/60-successexit.conf
# wq#2572 Mode C: primary_tree_guard.py already self-alerts (alert(), deduped via
# STATE_PATH/DIRTY_STATE_PATH/STASH_STATE_PATH) and already isolates crashes at
# exit 2 (try/except around main() in harness/primary_tree_guard.py:421-426).
# Prerequisite for this drop-in: harness/primary_tree_guard.py's alert() ntfy-send
# flags fix (wq#2572, same ops lane) must be deployed first -- the -T/-p fix is
# what makes the self-alert real instead of silently malformed.
[Service]
SuccessExitStatus=1
