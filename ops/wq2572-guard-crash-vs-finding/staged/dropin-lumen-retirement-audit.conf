# Deploy as /etc/systemd/system/lumen-retirement-audit.service.d/60-successexit.conf
# wq#2572 Mode C: /home/lumen/bin/retirement-audit's emit_alerts() already calls
# aq add + ntfy-send unconditionally for every "alert"/"warn" finding (aq dedups
# on (source,key)), and main() already isolates crashes at exit 2 (try/except,
# retirement-audit:462-466). cmd_run() returning 1 on an alert-severity finding
# is the only thing left marking the unit "failed" for a condition it already
# reported through its own channel.
[Service]
SuccessExitStatus=1
