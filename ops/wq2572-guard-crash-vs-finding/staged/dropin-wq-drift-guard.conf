# Deploy as /etc/systemd/system/wq-drift-guard.service.d/60-successexit.conf
# wq#2572 Mode C: /home/lumen/bin/wq-drift-guard's `check` case (the default,
# systemd-invoked path) already self-alerts via alert() (ntfy-send), deduped via
# STATE/BRANCH_STATE files, and its exit vocabulary is fully explicit: 0 clean,
# 1 CLOBBER (alerted-or-already-alerted), 2 repo missing (crash), 4 BRANCH
# (alerted-or-already-alerted). 3 (fix-refused) is only reachable from --fix, not
# the check path systemd runs. 1 and 4 are findings; everything else stays a
# real failure and OnFailure= still fires for it.
[Service]
SuccessExitStatus=1 4
