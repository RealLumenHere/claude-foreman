# /etc/systemd/system/dc-gateway.service.d/dc-gateway-hardening.conf (ANUBIS)
#
# wq#2607 T1 hardening, per MCP_CONTROL_PLANE_HA_DESIGN.md §3.3: "Unit hardening
# (Lumen unit too): MemorySwapMax=1G (today: 16G swap peak, unbounded), CPUWeight=1000,
# IOWeight=1000, Nice=-5, OOMScoreAdjust=-900". Lumen's live unit (fetched 2026-09-25)
# only carries CPUWeight/IOWeight as `systemctl set-property` drop-ins under
# /run/systemd/system.control/ — MemorySwapMax/Nice/OOMScoreAdjust are NOT live on
# Lumen yet, so this file is new content, not a copy; apply the equivalent drop-in to
# Lumen's own unit in the same pass so both nodes match §3.3 (tracked as a follow-up,
# not part of this ticket's file set).
[Service]
CPUWeight=1000
IOWeight=1000
MemorySwapMax=1G
Nice=-5
OOMScoreAdjust=-900
