# /etc/systemd/system/dc-gateway.service.d/dc-gateway-logging.conf (ANUBIS)
#
# wq#2607 parity with Lumen's no-body-logs-journald.conf: supergateway logs every
# MCP request/response body at the unit's default --logLevel info. Route stdout to a
# local, permission-restricted, size-capped file instead of journald (secrets-at-rest,
# same reasoning as Lumen's drop-in, wq#1698). The log file must exist with mode 0600
# owner anubis:anubis BEFORE this drop-in takes effect (systemd's `append:` target
# does not create-with-mode) — see README.md step list. Pair with a logrotate stanza:
# size=50M rotate=3, matching MCP_CONTROL_PLANE_HA_DESIGN.md §3.3.
[Service]
StandardOutput=append:/home/anubis/logs/supergateway/dc-gateway.log
StandardError=journal
