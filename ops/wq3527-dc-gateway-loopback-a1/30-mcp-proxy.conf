# Install as: /etc/systemd/system/dc-gateway.service.d/30-mcp-proxy.conf (horus)
# then: systemctl daemon-reload && systemctl restart dc-gateway
#
# wq#3527: dc-gateway's mcp-proxy cutover on horus kept parity with the old
# supergateway unit's --host 0.0.0.0, leaving :3100 (full shell-exec,
# desktop-commander, no auth in mcp-proxy itself) reachable from any LAN/
# tailnet peer, not just the two local consumers (cloudflared, watchdog —
# both already 127.0.0.1). Flip to loopback-only.
#
# NOT :: — asyncio sets IPV6_V6ONLY on a dual-stack bind, which breaks the
# plain 127.0.0.1 health/watchdog checks (ticket's explicit warning).
#
# This BUILD lane has no `ssh(horus)` grant (see README.md), so the live
# ExecStart below is NOT verified against horus — `systemctl cat
# dc-gateway.service` there first, copy its real ExecStart line, and only
# change the `--host 0.0.0.0` token to `--host 127.0.0.1`. Do not apply this
# file verbatim without that check.
[Service]
ExecStart=
ExecStart=<copy horus's live dc-gateway ExecStart here, with --host 0.0.0.0 changed to --host 127.0.0.1>
