# /etc/systemd/system/minerva-proposal.service.d/40-judge-model.conf
# wq#1501 (2026-09-08): Minerva verify judge on the FREE/LOCAL rung.
#
# Why (design PROMOTER_JUDGE_REPAIR_DESIGN.md §1b-1d, §2b-2c):
#   * The primary judge was deepseek-v4-flash (paid) behind a hard-coded 40s
#     request timeout; since 09-04 the majority of verify calls failed closed as
#     judge_err:ReadTimeout (journal 09-04..09-08 06:44: 23 of 34 verify lines).
#   * VERIFY_JUDGE_MODEL_2=mistral-small was NOT a LiteLLM rung, so every
#     fallback 4xx'd (fallback:judge_http_429/4xx on all 23). A phantom rung is
#     worse than no rung: it turns a retry into a guaranteed fail-closed REJECT.
#   * Frank constraint: no paid-model spend on the judge. qwen36-local =
#     llama-server on Isis :8095 (n_ctx 8192), ~10-11s/sample with the digest
#     prefix cached, 60-150s+ cold prefill on a CPU box that also serves LPP.
#
# No free+alive fallback exists today (cerebras 402, gemini-flash tier
# exhausted, claude-max :8091 dead), so VERIFY_JUDGE_MODEL_2 is EMPTY on
# purpose. Empty means "no second rung": the guard fail-closes on a judge
# outage exactly as before, but never burns a call on a rung that cannot answer.
# Do not put a name here unless it appears in the LiteLLM model list
# (ops/wq1501-minerva-judge-rung/verify_judge.py env checks this).
#
# Timeout: 230s. Under LPP load the primary call is pinned at the limit on
# every call (06:45 run: 9/9 at 150s; 10:45 run: 3/3 at 230s, Isis slot 0 still
# prefilling the 6144-token judge prompt minutes later) and a retry answers in
# ~2s from a rung this file does not name (wq#1529 identifies it). Idle Isis
# measures ~44s cold / 10-11s warm, so 230s keeps the free path viable when the
# box is not saturated and a 10-proposal run still fits the 4h timer.
#
# One self-consistency sample: 3 samples x 60-150s prefill saturates Isis for
# hours per run. SpanUQ-lite vote confidence is advisory only; the pass/fail
# score is unchanged by n=1.
#
# Rollback: sudo cp /home/lumen/backups/wq1500-1501/<newest>.40-judge-model.conf.bak.* \
#   /etc/systemd/system/minerva-proposal.service.d/40-judge-model.conf && systemctl daemon-reload
# Source of truth: /home/lumen/foreman/ops/wq1501-minerva-judge-rung/ (apply.sh installs it).
[Service]
Environment=VERIFY_JUDGE_MODEL=qwen36-local
Environment=VERIFY_JUDGE_MODEL_2=
Environment=VERIFY_JUDGE_TIMEOUT=230
Environment=VERIFY_JUDGE_MAX_TOKENS=600
Environment=VERIFY_JUDGE_SAMPLES=1
