# liveness_ledger.yaml — canonical ledger (research/LIVENESS_GATE.md §7).
# One record per credential (WHERE it lives and HOW to verify it — never the value),
# one per done-capability, plus `bindings:` = staged Liveness tags for tickets that
# predate the `Liveness:` line. Ticket-generation for frank-* lanes reads this first.
# Updated by hand or by the sweep's --refresh (Slice 3, not built). Dates are the
# last LIVE verification, not the mint date.

credentials:
  claude-oauth:
    path: /home/lumen/.claude/.credentials.json  # claudeAiOauth.{expiresAt,refreshTokenExpiresAt}
    scope: Claude Max OAuth session (every fworker, messenger brain on anthropic backend, governor usage poll)
    scheme: claude_oauth
    expiry: claudeAiOauth.refreshTokenExpiresAt (ms); ~30d lifetime from last `claude auth login`
    remint: ssh lumen@100.117.66.102 'claude auth login'
    last_verified: 2026-09-19
    probe: sentinel probe-credential-expiry (wq#1694) — WARN <=72h, URGENT <=24h
  github-frank:
    path: /home/lumen/.secrets/github-frank.token
    scope: frankstupak PAT (repo read/admin as Frank); canonical, consumers point here
    verify_url: https://api.github.com/user
    scheme: bearer
    last_verified: 2026-09-07
    probe: cred_alive(/home/lumen/.secrets/github-frank.token, https://api.github.com/user)
  github-lumen:
    path: /home/lumen/.secrets/github-lumen.token
    scope: Lumen Industries PAT (fleet PRs on Jay's repos + lumen/*)
    verify_url: https://api.github.com/user
    scheme: bearer
    last_verified: 2026-09-07
    probe: cred_alive(/home/lumen/.secrets/github-lumen.token, https://api.github.com/user)
  tailscale-api:
    path: /home/lumen/.secrets/tailscale-api.key
    scope: tailnet API (devices read; key-expiry audit)
    verify_url: https://api.tailscale.com/api/v2/tailnet/-/devices
    scheme: bearer
    last_verified: 2026-09-07
    probe: cred_alive(/home/lumen/.secrets/tailscale-api.key, https://api.tailscale.com/api/v2/tailnet/-/devices)
  cf-dns-edit:
    path: /home/lumen/.secrets/cf-dns-edit.token
    scope: Cloudflare Zone DNS Edit (lumennode.uk)
    verify_url: https://api.cloudflare.com/client/v4/user/tokens/verify
    scheme: bearer
    last_verified: 2026-09-07
    probe: cred_alive(/home/lumen/.secrets/cf-dns-edit.token, https://api.cloudflare.com/client/v4/user/tokens/verify)
  cf-email-routing:
    path: /home/lumen/.secrets/cf-email-routing.token
    scope: Cloudflare Email Routing Addresses+Rules Edit (was listed PENDING in claude_credentials.md — it exists and verifies)
    verify_url: https://api.cloudflare.com/client/v4/user/tokens/verify
    scheme: bearer
    last_verified: 2026-09-07
    probe: cred_alive(/home/lumen/.secrets/cf-email-routing.token, https://api.cloudflare.com/client/v4/user/tokens/verify)
  cf-deploy:
    path: /home/lumen/mailbot/.cf_deploy_token
    scope: Cloudflare Workers Scripts:Edit + D1:Edit (mailbot deploy; every E1-schema/E1-version heal in LUMEN_PUBLIC_RUNBOOK.md:176 shells wrangler with this token)
    verify_url: https://api.cloudflare.com/client/v4/user/tokens/verify
    scheme: bearer
    last_verified: 2026-09-20  # DEAD — 401 Invalid API Token (wq#2105); Frank re-mint queued as wq#2106
    probe: cred_alive(/home/lumen/mailbot/.cf_deploy_token, https://api.cloudflare.com/client/v4/user/tokens/verify)
  cerebras:
    path: /home/lumen/agent/.env  # CEREBRAS_API_KEY
    scope: Cerebras inference (gpt-oss-120b judge rung)
    last_verified: 2026-09-07
    probe: balance_over(cerebras, 0)

done_capabilities:
  ts_key_expiry_disabled:
    since: 2026-06
    evidence: TS API devices list, every device keyExpiryDisabled=true (2026-09-07, wq#1296 premise)
    probe: ts_key_expiry_disabled()
  questfree_not_public:
    since: 2026-09-07
    evidence: frankstupak/questfree private=true; RealLumenHere/questfree unauth 404 (not publicly visible)
    probe: repo_is(private, RealLumenHere/questfree), repo_is(private, frankstupak/questfree)
  github_frank_pat_canonical:
    since: 2026-08-30
    evidence: .secrets/github-frank.token answers 200; the 401 copy was archived as .bak.20260830_151512_dead401
    probe: cred_alive(/home/lumen/.secrets/github-frank.token, https://api.github.com/user)

# Staged Liveness tags for open frank-gated tickets that predate the tag. The sweep
# uses these when the ticket has no `Liveness:` line. Slice 3 writes them into the
# tickets; until then this is the only place they exist. Keys are wq ids.
bindings:
  902: repo_is(private, RealLumenHere/questfree), repo_is(private, frankstupak/questfree)
  1101: repo_is(private, frankstupak/lumen-content), repo_is(private, frankstupak/lumen-blog)
  1133: cred_alive(/home/lumen/.secrets/github-frank.token, https://api.github.com/user)
  1296: ts_key_expiry_disabled()
  1047: balance_over(cerebras, 0)
  362: node_healthy(hathor)
  # wq#1492 backlog sweep (LIVENESS_GATE.md §13). Rule: a binding is written ONLY when
  # all-SATISFIED means the ticket's ASK is delivered, not merely that it is unblocked.
  # A prerequisite dep (deps= column, "blocked on wq#N") is therefore NOT bound —
  # see ops/wq1492-liveness-backlog-sweep/no_tag_reasons.yaml for every kept ticket.
  703: file_contains(/home/lumen/foreman/worker-settings-general.json, Skill)
  765: ticket_done(756), ticket_done(757), ticket_done(764)
  843: json_gte(/home/lumen/foreman/dispatcher/config.json, cloud_ceiling, 5)
  855: service_active(fleet-update-check.timer@lumen)
  1008: path_exists(/home/lumen/secrets/reddit.env)
  # wq#2105: was path_exists(), which stayed SATISFIED straight through the token's
  # silent death — a no-expiry API token fails a file-existence check open forever.
  1269: cred_alive(/home/lumen/mailbot/.cf_deploy_token, https://api.cloudflare.com/client/v4/user/tokens/verify)
  1338: pr_merged(lumen/mailbot, 3)
  1344: pr_merged(lumen/claude-foreman, 186, closed)
  1358: pr_merged(lumen/mailbot, 5)
  1388: pr_merged(lumen/lumen-bin, 61)
  1473: file_contains(/home/lumen/foreman/dispatcher/config.json, frank-cred)
  # 1322 pr_merged(lumen/lumen-bin, 57), 1333 ticket_done(1437,1438,1441), 1440
  # pr_merged(lumen/lumen-bin, 63) were staged here and probed SATISFIED on the
  # 2026-09-08 dry run; orch-fleetops-broker closed all three by hand on the same
  # premise minutes earlier (reports/1492_liveness_backlog_sweep.md), so no binding.
