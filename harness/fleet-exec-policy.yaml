# fleet-exec-policy.yaml — static, crown-jewel policy for /home/lumen/bin/fleet-exec
# (wq#1332, WORKER_EXEC_CAPABILITY_GAP.md §2.4). Lands ONLY by PR into foreman; a
# worker can never widen this file, and no `needs:` tag on any ticket can grant past
# it — the broker checks a per-ticket grant (dispatcher-derived from `needs:` tags)
# AND this policy, and denies unless BOTH agree (fail-closed).
#
# `thor` gets its own hardcoded lock in fleet_exec_policy.py (THOR_HARDLOCK) in
# addition to the `never.nodes` row below — instinct tier 0 #1 (THOR IS THE ONLY
# HARD RULE) is enforced in code, not just data, so an edited/corrupted copy of this
# file still can't open Thor beyond read-only run + copy-into-lumen-drop.
#
# Rollback (design §5.1/5.3): `chmod 000` this file — fleet-exec fails closed on an
# unreadable policy (every verb denies with rule=policy_unreadable).

never:
  # No verb at all on these nodes except: `run` with an argv on run_readonly_cmds,
  # and `copy` whose remote dir is that node's lumen-drop (see copy_dirs below).
  # restart/sudo/bench/power are therefore always denied on every node in this list.
  nodes: [thor]

  # power is v2 (fleet-exec has no `power` verb yet) — this row is enforced by
  # fleet_exec_policy.check_power() now so the policy matrix and future v2 wiring
  # share one source of truth instead of a second copy drifting in later.
  power: [thor, lumen, maat, sobek, bes]

  # restart is v1. Per-node unit globs that are never restartable via the broker,
  # regardless of any grant. fnmatch-style '*' globs.
  restart:
    lumen:
      - "vaultwarden*"
      - "cloudflared"
      - "desktop-commander-mcp"
      - "postgresql*"
      - "tailscaled"
      - "sshd"
    maat:
      - "*"
    sobek:
      - "postgresql*"
      - "cloudflared"

  # sudo is v2 (fleet-exec has no `sudo` verb yet). argv[0] basenames never allowed
  # even once sudo lands, on any node, regardless of any grant.
  sudo_argv_deny:
    - ip
    - macchanger
    - dd
    - "mkfs*"
    - wipefs
    - visudo
    - passwd
    - useradd
    - chpasswd
    - "tailscale up*"
    - "systemctl mask*"

# allow: explicit GRANT side (wq#1441, research/BROKER_GRANT_COVERAGE.md). Deny is the
# default: capability_lint emits a `needs:` tag ONLY for a target listed here (after
# `never` above, which always wins). Anything not listed lands the ticket in
# `needs_unresolved` with a propose-by-PR hint — never a silent grant.
allow:
  # READ: dir(X) auto-tags only when X is under one of these roots. Every root was
  # swept with harness/read_dir_sweep.py (masked; basename globs + token regexes)
  # on 2026-09-08, zero hits — evidence table in BROKER_GRANT_COVERAGE.md §3. Add a
  # root only with a fresh zero-hit sweep in the PR body. Deliberately NOT here:
  # /home/lumen/agent (live .env + .env.bak tokens), /home/lumen/sentinel/* (sntl
  # tokens, wq#1466), /home/lumen/minerva (credentials mirrored into context/sections,
  # wq#1467), /home/lumen/messenger (vapid key, chat-log token), /home/lumen/fleet
  # (token in patches/wq1454).
  read_dirs:
    - /home/lumen/fleet-units         # wq#1774: narrow grant, sweep hits=0 (410 files), deploy unit artifacts
    - /home/lumen/autonomy/agent5     # wq#1779: narrow grant, sweep hits=0 (45 files, .py source), DGM retirement
    - /home/lumen/minerva/eval   # wq#1738: narrow grant, sweep hits=0 (508 files), NOT the parent minerva (credentials in context/sections)
    - /home/lumen/research_prompts
    - /home/lumen/decisions
    - /home/lumen/instructions
    - /home/lumen/security
    - /home/lumen/etc
    - /home/lumen/hapi/eval
    - /home/lumen/pstack
    - /home/lumen/personas
    - /home/lumen/questfree/docs
    - /home/lumen/projects/bench
    - /home/lumen/infra
    # wq#1697 follow-on: split-watch retire/apply work (wq#1739) cites this dir.
    # Swept 2026-09-19 with harness/read_dir_sweep.py: files=2, hits=0.
    - /home/lumen/agents/split-watch
    # wq#1535: minerva_promote.publish() copies proposal.md + plan.md here per proposal,
    # masked through read_dir_sweep.PATTERNS at write time (fail closed if the sweep
    # module is unavailable). Swept 2026-09-08 after publishing all 14 live proposals:
    # zero hits (research/PROMOTER_TICKET_REACH.md §4.3, BROKER_GRANT_COVERAGE.md §3).
    - /home/lumen/proposals
    # wq#1559: pilot cards and reports. minerva_defer_review writes CARD.md here from
    # proposal columns (title/current_state/proposed_change/decision_reason) and the
    # pilot writes REPORT.md. No credential surface: /home/lumen/minerva itself stays
    # OFF this list, minerva.db is never copied to a pilot node, and a pilot that needs
    # fleet data takes a purpose-built column extract written on Lumen. Swept with
    # harness/read_dir_sweep.py 2026-09-08 after generating the first card: zero hits.
    - /home/lumen/foreman/pilots
    # de-spaghettifier (wq#1803-1815): the Phase-0 wiring spec + decision docs, and a
    # worker-readable mirror of HarnessRouter CE src (Apache-2.0) WITHOUT tests/, ui/ and
    # .env.example — the original research/harnessrouter tree carries 5 sweep hits
    # (placeholder sk-test keys in gateway/tests, an .env.example, a UI apiKey stub), so
    # the mirror is what gets granted, never the original. Swept 2026-09-11 with
    # harness/read_dir_sweep.py: harnessrouter-ref files=127 hits=0,
    # projects/de-spaghettifier files=1 hits=0 (evidence in the PR body). Refresh recipe
    # is in research/harnessrouter-ref/README.md.
    - /home/lumen/projects/de-spaghettifier
    - /home/lumen/research/harnessrouter-ref
    # wq#1738 / wq#1614 (entry is /home/lumen/minerva/eval at the top of this list, moved there
    # by 4dfb16e): minerva golden sets + bench scripts only. /home/lumen/minerva itself
    # stays OFF this list (wq#1467: credentials mirrored into context/sections). Sub-root
    # matching is component-bounded (harness/capability.py:118-120), so this grants nothing
    # under context/, sections.json, minerva.db or the sibling eval_sets/. Swept 2026-09-13
    # with harness/read_dir_sweep.py: /home/lumen/minerva/eval files=508 hits=0 (evidence in
    # the PR body). Decision record: research/MINERVA_EVAL_GRANT_DECISION.md.
    # wq#1738 follow-on (research/MINERVA_EVAL_GRANT_DECISION.md §5): sweep-GATED code-only
    # mirror of /home/lumen/minerva produced hourly by ops/minerva-ref-sync/minerva_ref_sync.py.
    # Filter: context/, tests/, archival/, archive/, backups/, logs/, staging/, retention/,
    # gate-redteam/, .git/, *.db*, *.bak* and every deny basename. Guarantee: every publish
    # sweeps the RESULT with harness/read_dir_sweep.py and refuses (prior mirror kept, aq
    # alert) on any hit — a secret in an unanticipated file can never reach this root.
    # /home/lumen/minerva itself stays OFF this list (wq#1467). Sweep 2026-09-13:
    # research/minerva-ref files=2317 hits=0 (evidence in the PR body).
    - /home/lumen/research/minerva-ref

  # RESTART: unit globs per node the lint may tag restart(unit@node) for. Each entry
  # was verified per-target before listing (unit LoadState=loaded, `sudo -n true`
  # exits 0 on the node, unit not in never.restart, a fleet probe exists to verify
  # after). The broker's own gate (fleet_exec_policy.check_restart + never rows +
  # holddown + verify-after) is unchanged and still applies at call time.
  restart:
    isis: [ollama]              # proven e2e 2026-09-06 (wq#1440, lumen-bin PR #63)
    lumen: [lumen-messenger, lumen-pokemon-live]    # lumen-messenger: wq#1350; lumen-pokemon-live: wq#1360
                                # (LPP live loop; verified 2026-09-08: LoadState=loaded, active, sudo -n ok,
                                #  not never-listed; probe = sentinel probe_pokemon_liveness incl. flap guard)

  # SSH: nodes the lint may tag ssh(node) for (read-only `run` under
  # run_readonly_cmds only). thor is never here: never.nodes covers it.
  # wq#1559: hathor added as the first pilot node. Verified 2026-09-08 before listing —
  # `ssh hathor@100.80.71.13` exits 0 key-only, hostname=hathor, 24 threads / 60G,
  # load 0.00, up 8d. NOTE the ssh grant is READ-ONLY run + copy-into-pilots; hathor is
  # deliberately absent from allow.restart, so the broker still denies every restart on
  # it exactly as it did before this change.
  ssh: [lumen, isis, bes, anubis, maat, sobek, hathor]

# run: read-only probe set. Each entry is either a bare basename (argv[0] must equal
# it exactly) or "<basename> <subcmd-pattern>" (argv[1] must fnmatch one of the
# '|'-separated patterns). argv is never shell-joined; metacharacters, -c/bash/sh/
# eval are rejected before this list is even consulted (fleet_exec_policy.check_run).
#
# wq#1297 (research/FLEET_MAP.md): no pull verb (ollama pull, docker/podman pull,
# git lfs pull|fetch) belongs on this list or any allow.* list above. A large pull
# is a bridge-saturation risk worse than any monitor and stays manual/off-peak —
# never something a cron/fworker-derived grant can reach. Deny is the default for
# anything absent here; do not add one "just for isis" without a fresh review.
run_readonly_cmds:
  - "true"
  - uptime
  - hostname
  - uname
  - cat
  - ls
  - stat
  - df
  - free
  - "systemctl status|is-active|is-enabled|show|cat|list-*"
  - journalctl
  - ss
  - "ip addr"
  - "tailscale status"
  - "docker ps"
  - "docker logs"

# The one narrow exception to "no -c": a python3 probe is allowed ONLY when the
# remaining argv, joined with single spaces, exactly matches one of these strings —
# never a worker-supplied string. Add new probes here (PR review), never widen the
# match to a prefix/glob.
run_readonly_python_probes:
  - "import shutil; print(shutil.disk_usage('/'))"

# sudo is v2 — this is the allowlist check_sudo() will use once fleet-exec grows a
# `sudo` verb. Same two-token pattern shape as run_readonly_cmds.
sudo_cmds:
  - "systemctl restart|reload|start <unit>"
  - "install -m0644 <src> <dst-under:/etc/<pkg>/>"
  - "apt-get install -y <pkg>"
  - "tee <dst-under:/etc/systemd/system/>"

# copy: verb v1. Destination directories a `copy` may land files into, per node.
# Nothing outside this list is a valid target for any node, including thor's.
copy_dirs:
  thor: [/home/thor/lumen-drop]
  isis: [/home/isis/lumen-drop]
  lumen: [/home/lumen/lumen-drop]
  maat: [/home/maam/lumen-drop]  # ssh user on maat is maam (wq#1444)
  sobek: [/home/sobek/lumen-drop]  # re-added wq#1447: fleet-keymesh now lists sobek, `ssh sobek -- true` exits 0
  bes: [/home/bes/lumen-drop]
  # wq#1559: hathor is the first pilot node. The ticket named the remote root as
  # "/home/lumen/pilots on hathor"; there is no /home/lumen on hathor — the ssh user
  # is `hathor` and $HOME is /home/hathor (verified 2026-09-08: `ls -d /home/lumen` ->
  # No such file or directory). The remote root is therefore /home/hathor/pilots,
  # matching every other node's <node-home> convention above. /home/lumen/foreman/pilots
  # on LUMEN stays the root of record for CARD.md and REPORT.md.
  hathor: [/home/hathor/pilots, /home/hathor/lumen-drop]

# bench is v2 (fleet-exec has no `bench` verb yet).
bench_tools:
  thor: [adb, fastboot]
