# limpet-plugin-remote-cli — shared terminal backend for Limpet
# wq#4396 integrated remote-cli (wq#4395's custom shared-PTY daemon) as
# Limpet's agent-facing terminal. wq#4419 retires remote-cli and retargets
# this plugin at shared-terminal (lumen-bin PR #262): the same shared
# Frank+agent session, now backed by tmux on a dedicated server socket
# (`tmux -L shared`), which gives screen replay on attach, resize/detach,
# and faithful rendering of picocom/mtkclient/adb output — everything the
# custom daemon lacked.
#
# First-party: mcp/server.py is Limpet's own MCP wrapper (same pattern as
# limpet-plugin-flashrom); it shells out to the shared-terminal CLI, whose
# surface is unchanged by this plugin.
#
# wq#4433 adds serial_console_open/catch/expect, wrapping the `serial-console`
# CLI (a thin layer over shared-terminal that gives a UART device exactly one
# port owner, picocom in the shared tmux session, plus a boot-window catch
# loop). snapshot/send/scrollback/status/list/kill already cover a serial
# session through the tools above, since serial-console delegates those
# straight to shared-terminal.

[plugin]
name = "remote-cli"
version = "0.2.0"
manifest_version = 1
category = "hardware-interface"
description = "Shared terminal backend: a Frank+agent tmux session with start/send/snapshot/scrollback/wait, backed by shared-terminal (wq#4419); plus serial_console_open/catch/expect for one-port-owner UART consoles (wq#4433) and term_do/term_at/term_catch combined-verb tools matching re-term (wq#4443)."
license = "MIT"
homepage = ""
repository = ""
authors = ["Lumen Industries"]

[capabilities]
headless = true
gui = false
architectures = ["any"]
input_formats = ["text"]
output_formats = ["text", "JSON"]

[paths]
binary = "/home/lumen/bin/shared-terminal"
install_dir = "/opt/limpet/plugins/remote-cli"

[health]
# The shared tmux server's socket. Present iff at least one shared session is
# (or was) running under `tmux -L shared` for this user.
check = "test -S /tmp/tmux-$(id -u)/shared"
interval = "1h"
timeout = "10s"
startup_grace = "5s"

[dependencies]
requires = []
system_packages = ["tmux"]
conflicts = []

[mcp]
enabled = true
server = "limpet-shared-terminal-mcp"
transport = "stdio"
command = "python3"
args = ["/opt/limpet/plugins/remote-cli/mcp/server.py"]
env = {}

[mcp.tools_energize]
# wq#4419 ticket-specified classification: reading the screen, history, the
# session inventory, metadata, or polling for a regex never writes to the
# shared session, so none of these need energize-confirm.
snapshot = false
scrollback = false
list = false
status = false
wait = false
# Typing keystrokes into a terminal a human may be watching live (passwords,
# control sequences, a stray Ctrl-C) goes through Sentinel's energize-confirm
# gate; `start` creates a session and may launch an arbitrary command in it,
# strictly more consequential than raw keys, so it is gated too.
send = true
start = true
# wq#4433: serial-console's open spawns `sudo picocom` as root (taking sole
# ownership of the port) and catch drives keys during a boot window — same
# category as start/send above. expect only polls the screen, like wait.
serial_console_open = true
serial_console_catch = true
serial_console_expect = false
# wq#4443: term_do/term_at/term_catch combine a read and a write in one call
# (re-term's do/at/catch) — each one always ends in a send, so all three are
# gated the same as send/serial_console_catch above.
term_do = true
term_at = true
term_catch = true

[agent_hints]
summary = "Shared tmux terminal: Frank and an agent see and drive the same session. snapshot/scrollback/list/status/wait are read-only recon of what's on screen or in history; send/start mutate the live session and are energize-gated. serial_console_open/catch/expect (wq#4433) add a one-port-owner UART console on top: open starts picocom as the port's sole owner, catch spams a key through a boot window, expect polls for a regex without typing. term_do/term_at/term_catch (wq#4443) are re-term's combined do/at/catch verbs — send+snapshot, wait-then-send, and the catch loop generalized past serial sessions — so the fast agent loop re-term gave over SSH works the same way through MCP."
when_to_use = "Bench RE work where Frank is watching a target's console/bootloader session live and wants the agent to drive or observe it without a copy-paste or screenshot round trip. serial_console_* specifically for UART/bootloader RE (U-Boot, OpenWrt failsafe, Hit-any-key/Press-f boot windows) where a second picocom/pexpect process fighting the same port for keystrokes is the exact failure this exists to prevent."
when_not_to_use = "Not for unattended command execution against a target the agent owns outright — use a plain shell/SSH session for that. This plugin exists specifically because the terminal is SHARED with a human. serial_console_* is not for a port no one is sharing — a plain pyserial/picocom session is simpler when no human needs to watch live."
complements = ["serial-mcp"]
supersedes = []
workflow_position = "interact"

[resources]
max_memory = "128M"
max_instances = 1
gpu_required = false
estimated_startup_time = "1s"
